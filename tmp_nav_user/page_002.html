<meta charset="UTF-8">

<title>Neon Cyber — Sample</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { width: 1920px; height: 1080px; overflow: hidden; }

  body {
    width: 1920px; height: 1080px;
    background: radial-gradient(circle at 20% 15%, rgba(0,245,212,0.10) 0%, rgba(10,10,18,0) 28%), linear-gradient(180deg, #0f0f14 0%, #14141f 55%, #0a0a10 100%);
    font-family: 'Space Grotesk', 'PingFang SC', sans-serif;
    color: #f0f0f8;
    padding-top: 0;
    position: relative;
    display: flex; flex-direction: column;
  }
  /* Top bar */
  .topbar {
    background: rgba(15,15,20,0.88);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border-bottom: 1px solid rgba(139,92,246,0.15);
    border-top: 1px solid rgba(200,220,255,0.06);
    padding: 0 60px;
    height: 72px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .logo { font-size: 18px; font-weight: 700; color: #f0f0f8; letter-spacing: -0.02em; }
  .logo span { color: #00f5d4; }
  .nav-items { display: flex; gap: 40px; align-items: center; }
  .nav-item { font-size: 15px; color: #686880; cursor: pointer; transition: color 0.2s; }
  .nav-item:hover { color: #f0f0f8; }
  .nav-item.active { color: #00f5d4; font-weight: 500; }
  .nav-item.active::after {
    content: '';
    display: block;
    height: 2px;
    background: #00f5d4;
    margin-top: 2px;
    border-radius: 1px;
  }
  /* Progress bar */
  .progress-bar {
    height: 3px;
    background: rgba(0,0,0,0.35);
    flex-shrink: 0;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #4361ee, #00f5d4);
    width: 42%;
    transition: width 0.3s ease;
  }
  /* Page content placeholder */
  .content {
    flex: 1;
    padding: 80px 120px;
    display: flex; flex-direction: column; justify-content: center;
  }
  .section-label { font-size: 13px; color: #00f5d4; letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 20px; }
  .title { font-size: 58px; font-weight: 700; line-height: 1.08; letter-spacing: -0.03em; color: #f0f0f8; margin-bottom: 24px; }
  .body { font-size: 22px; line-height: 1.7; color: #686880; max-width: 800px; }
  /* Bottom bar */
  .bottombar {
    padding: 0 60px 28px;
    display: flex; justify-content: space-between; align-items: center;
    flex-shrink: 0;
  }
  .bottom-text { font-size: 13px; color: rgba(154,167,189,0.5); }
  .page-num { font-size: 13px; color: rgba(154,167,189,0.6); }
</style>

<script id="vp-page-anim-boot">(function(){
  function done(){
    if(document.body){
      document.body.setAttribute('data-vp-anim-ready','1');
      try{ window.dispatchEvent(new CustomEvent('vp-anim-ready')); }catch(e){}
    }
  }
  function run(){
    if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches){
      done(); return;
    }
    setTimeout(done, 1600);
  }
  if(document.readyState==='complete') run();
  else window.addEventListener('load', run);
})();</script>
