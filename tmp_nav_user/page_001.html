<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, height=1080">
<title>Deck</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { width: 1920px; height: 1080px; overflow: hidden; }

  body {
    width: 1920px; height: 1080px;
    background: var(--sf-cover-bg);
    font-family: var(--sf-font);
    color: var(--sf-text-primary);
    display: flex; align-items: center; justify-content: center;
    position: relative; overflow: hidden;
  }
  .corner-accent {
    position: absolute; top: 0; right: 0;
    width: 480px; height: 480px;
    background: var(--sf-corner-accent);
    pointer-events: none;
  }
  .bottom-line {
    position: absolute; bottom: 0; left: 0; right: 0;
    height: 3px;
    background: var(--sf-bottom-line-gradient);
  }
  .content {
    position: relative; z-index: 2;
    text-align: center; max-width: 1200px; padding: 0 80px;
  }
  .eyebrow {
    display: inline-block;
    font-size: 13px; font-weight: 500; letter-spacing: 0.22em;
    color: var(--sf-eyebrow); text-transform: uppercase;
    border: var(--sf-eyebrow-ring);
    border-radius: 100px; padding: 7px 22px; margin-bottom: 40px;
  }
  .title {
    font-size: var(--sf-cover-title-size, clamp(88px, 6.5vw, 112px)); font-weight: 700; line-height: 0.98;
    letter-spacing: -0.045em; color: var(--sf-text-primary); margin-bottom: 36px;
  }
  body.vp-cover.vp-vw-hero .title {
    font-size: var(--sf-cover-title-size, clamp(96px, 7vw, 120px));
    text-shadow: 0 0 80px var(--sf-cover-title-glow);
  }
  body.vp-cover .subtitle {
    font-size: 28px;
    color: var(--sf-subtitle-lede);
    letter-spacing: 0.01em;
  }
  .accent-bar {
    width: 72px; height: 3px;
    background: var(--sf-accent-bar-gradient);
    margin: 0 auto 36px; border-radius: 2px;
  }
  .subtitle {
    font-size: 26px; font-weight: 400; line-height: 1.5;
    color: var(--sf-text-subtitle); max-width: 720px; margin: 0 auto;
  }
  .page-num {
    position: absolute; bottom: 56px; right: 120px;
    font-size: 13px; color: var(--sf-page-num);
  }
</style>
<style id="sf-theme-tokens">

<style id="sf-q1-visual">
/* Q1-B — visual slot (injected by html_generator) */
.vp-visual-slot .vp-hero-image,
.vp-visual-slot .vp-diagram-image,
.vp-visual-slot .vp-brand-mark {
  position: relative;
  z-index: 2;
}
.vp-visual-slot:has(.vp-hero-image)::before,
.vp-visual-slot:has(.vp-hero-image)::after,
.vp-visual-slot:has(.vp-diagram-image)::before,
.vp-visual-slot:has(.vp-diagram-image)::after {
  display: none !important;
}
.vp-visual-slot:has(.vp-hero-image) .vp-visual-slot-label {
  z-index: 3;
}

<style id="vp-page-anim-style">

@keyframes vp-fade-up {
  from { opacity: 0; transform: translateY(18px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes vp-block-in {
  from { opacity: 0; transform: translateY(14px); }
  to { opacity: 1; transform: translateY(0); }
}

@media (prefers-reduced-motion: reduce) {
  body.vp-page-anim,
  body.vp-page-anim [data-vp-animate],
  body.vp-page-anim.vp-anim-preset-fade > *:not(.page-num):not(.hairline):not(.vp-footnote) {
    animation: none !important;
    opacity: 1 !important;
    transform: none !important;
  }
}
body.vp-page-anim.vp-anim-preset-stagger [data-vp-animate] {
  opacity: 0;
  animation: vp-block-in 0.48s cubic-bezier(0.22, 1, 0.36, 1) forwards;
}
</style>
<script id="vp-page-anim-boot">(function(){
  function done(){
    if(document.body){
      document.body.setAttribute('data-vp-anim-ready','1');
      try{ window.dispatchEvent(new CustomEvent('vp-anim-ready')); }catch(e){}
    }
  }
  function run(){
    if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches){
      done(); return;
    }
    setTimeout(done, 1600);
  }
  if(document.readyState==='complete') run();
  else window.addEventListener('load', run);
})();</script>
