<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, height=1080">
<title>结束页</title>
<style>
  /* 喜茶办公模板 · 尾页固定（与 PPT/PDF 第 3 页一致，不可改文案） */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1920px; height: 1080px;
    overflow: hidden;
    background: #ffffff;
  }
  .closing-fixed {
    display: block;
    width: 1920px;
    height: 1080px;
    object-fit: fill;
    pointer-events: none;
    user-select: none;
  }
</style>
<style id="sf-heytea-fonts">
/* 喜茶办公模板内置字体 — 渲染时复制到 heytea-assets/fonts/ */
@font-face {
  font-family: 'FZFW ZhuZi Hei R';
  src: url('heytea-assets/fonts/FZFWZhuZiHeiR.ttf') format('truetype');
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}

@font-face {
  font-family: 'Heytea Sans Serif';
  src: url('heytea-assets/fonts/HeyteaSansSerif-Regular.otf') format('opentype');
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}
</style>
<style id="sf-heytea-typography">
/* heytea 办公字号 / 字距（叠加 _core · shared 变体，不限制版式） */
body.vp-cover .title {
  font-size: var(--sf-heytea-cover-title, 60px) !important;
  font-weight: 400;
  line-height: 1 !important;
  letter-spacing: 1px;
}
body.vp-cover .subtitle {
  font-size: var(--sf-heytea-cover-subtitle, 32px) !important;
  line-height: 1 !important;
  letter-spacing: 1px;
}

body:not(.vp-cover):not(.vp-heytea-closing-fixed) .title {
  font-size: var(--sf-heytea-content-title, 40px) !important;
  font-weight: 400;
  line-height: 1 !important;
  letter-spacing: 1px;
}

body:not(.vp-cover):not(.vp-heytea-closing-fixed) .kp-item,
body:not(.vp-cover):not(.vp-heytea-closing-fixed) .body-text,
body:not(.vp-cover):not(.vp-heytea-closing-fixed) .panel-body,
body:not(.vp-cover):not(.vp-heytea-closing-fixed) .col-body,
body:not(.vp-cover):not(.vp-heytea-closing-fixed) .stat-label,
body:not(.vp-cover):not(.vp-heytea-closing-fixed) .quote-body {
  font-size: var(--sf-heytea-body, 32px);
  line-height: 1.5;
  letter-spacing: 0.5px;
}

body:not(.vp-cover):not(.vp-heytea-closing-fixed) .big-number,
body:not(.vp-cover):not(.vp-heytea-closing-fixed) .stat-value {
  font-family: var(--sf-font-latin, var(--sf-font));
}
</style>
<style id="sf-heytea-cover-brand">
/* 喜茶办公封面固定 logo（对照 PPT layout1 · image1）
 * 画布 1920×1080：left 841px · top 139px · 237×237 */
body.vp-heytea-cover .heytea-cover-logo {
  position: absolute;
  top: 139px;
  left: 841px;
  width: 237px;
  height: 237px;
  object-fit: contain;
  pointer-events: none;
  z-index: 6;
}
</style>
<style id="sf-theme-tokens">
/* heytea — 喜茶办公横版模板（对照 PPT 11.26）
 * 内置字体见 fonts.css + samples/themes/heytea/fonts/
 * 中文：方正 FW 筑紫黑 R · 数字/英文：Heytea Sans Serif Regular
 */
:root {
  --sf-font: 'FZFW ZhuZi Hei R', 'Heytea Sans Serif', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --sf-font-zh: 'FZFW ZhuZi Hei R', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --sf-font-latin: 'Heytea Sans Serif', 'PingFang SC', sans-serif;
  --sf-body-bg: #ffffff;
  --sf-body-gradient: #ffffff;
  --sf-text-primary: #1d1818;
  --sf-text-secondary: #1d1818;
  --sf-text-muted: #6b6565;
  --sf-text-subtitle: #4a4545;
  --sf-accent: #1d1818;
  --sf-accent-secondary: #1d1818;
  --sf-accent-light: #3d3838;
  --sf-eyebrow: #6b6565;
  --sf-eyebrow-ring: none;
  --sf-subtitle-lede: #4a4545;
  --sf-page-num: rgba(29, 24, 24, 0.45);

  --sf-panel-bg: transparent;
  --sf-panel-border: none;
  --sf-panel-border-top: none;
  --sf-panel-border-bottom: none;
  --sf-panel-shadow: none;
  --sf-panel-radius: 0;

  --sf-hairline: rgba(29, 24, 24, 0.12);
  --sf-hairline-gradient: rgba(29, 24, 24, 0.12);

  --sf-cover-bg: #ffffff;
  --sf-corner-accent: none;
  --sf-bottom-line-gradient: none;
  --sf-accent-bar-gradient: none;
  --sf-cover-title-glow: none;

  --sf-page-bg-text: #ffffff;
  --sf-page-bg-panel: #ffffff;
  --sf-page-bg-number: #ffffff;
  --sf-page-bg-stats: #ffffff;
  --sf-page-bg-compare: #ffffff;
  --sf-page-bg-process: #ffffff;
  --sf-page-bg-quote: #ffffff;

  --sf-kp-text: #1d1818;
  --sf-kp-divider: rgba(29, 24, 24, 0.08);
  --sf-kp-arrow-glow: none;
  --sf-card-muted-border: none;
  --sf-card-muted-bg: transparent;

  --sf-visual-slot-border: 1px solid rgba(29, 24, 24, 0.12);
  --sf-visual-slot-bg: #fafafa;
  --sf-visual-slot-shadow: none;
  --sf-visual-slot-grid-line-a: rgba(29, 24, 24, 0.08);
  --sf-visual-slot-grid-line-b: rgba(29, 24, 24, 0.04);
  --sf-visual-slot-bar: rgba(29, 24, 24, 0.06);
  --sf-visual-slot-bar-shadow: none;
  --sf-visual-slot-frame-border: 1px solid rgba(29, 24, 24, 0.12);
  --sf-visual-slot-label: rgba(29, 24, 24, 0.55);

  --sf-cta-pill-border: 1px solid rgba(29, 24, 24, 0.2);
  --sf-cta-pill-bg: rgba(29, 24, 24, 0.04);

  /* 办公模板字号（1920×1080 画布，对照 PPT pt×2） */
  --sf-heytea-cover-title: 60px;
  --sf-heytea-cover-subtitle: 32px;
  --sf-heytea-content-title: 40px;
  --sf-heytea-body: 32px;
  --sf-heytea-closing-title: 48px;
}
</style>
<style id="sf-q1-visual">
/* Q1-B — visual slot (injected by html_generator) */
.vp-visual-slot .vp-hero-image,
.vp-visual-slot .vp-diagram-image,
.vp-visual-slot .vp-brand-mark {
  position: relative;
  z-index: 2;
}
.vp-visual-slot:has(.vp-hero-image)::before,
.vp-visual-slot:has(.vp-hero-image)::after,
.vp-visual-slot:has(.vp-diagram-image)::before,
.vp-visual-slot:has(.vp-diagram-image)::after {
  display: none !important;
}
.vp-visual-slot:has(.vp-hero-image) .vp-visual-slot-label {
  z-index: 3;
}

</style>
</head>
<body class="vp-heytea-closing vp-heytea-closing-fixed">
  <img class="closing-fixed" src="heytea-assets/closing-slide.png" alt="" width="1920" height="1080" />
</body>
</html>
