<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, height=1080">
<title>Panel — slide-forge</title>
<style>
  /* _core · panel · wave6 */
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { width: 1920px; height: 1080px; overflow: hidden; }

  body {
    width: 1920px; height: 1080px;
    background: var(--sf-page-bg-panel);
    font-family: var(--sf-font);
    color: var(--sf-text-primary);
    padding: 80px 120px;
    position: relative;
    display: flex;
    flex-direction: column;
  }
  .label {
    font-size: 13px; font-weight: 500; letter-spacing: 0.15em;
    color: var(--sf-eyebrow); text-transform: uppercase; margin-bottom: 20px;
    flex-shrink: 0;
  }
  .title {
    font-size: var(--sf-title-size, 58px); font-weight: 700; line-height: 1.08;
    letter-spacing: -0.03em; color: var(--sf-text-primary); margin-bottom: 44px;
    flex-shrink: 0;
  }
  .panel {
    background: var(--sf-panel-bg);
    border: var(--sf-panel-border);
    border-top: var(--sf-panel-border-top);
    border-bottom: var(--sf-panel-border-bottom);
    border-radius: var(--sf-panel-radius);
    box-shadow: var(--sf-panel-shadow);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    padding: 48px 60px;
    width: 100%;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    min-height: 0;
  }
  .panel-eyebrow {
    font-size: 13px; color: var(--sf-eyebrow); font-weight: 500;
    letter-spacing: 0.1em; margin-bottom: 20px;
  }
  .panel-eyebrow:empty { display: none; }
  .panel-title {
    font-size: 28px; font-weight: 700; color: var(--sf-text-primary);
    line-height: 1.2; margin-bottom: 24px;
  }
  .panel-title:empty { display: none; margin-bottom: 0; }
  .kp-list { list-style: none; display: flex; flex-direction: column; flex: 1; }
  .kp-item {
    display: flex; align-items: center; gap: 20px;
    font-size: 38px; line-height: 1.45; color: var(--sf-kp-text);
    flex: 1;
    border-bottom: 1px solid var(--sf-kp-divider);
  }
  .kp-item:last-child { border-bottom: none; }
  .kp-arrow {
    flex-shrink: 0; width: 11px; height: 11px;
    background: var(--sf-accent); border-radius: 50%;
    box-shadow: var(--sf-kp-arrow-glow);
  }
  .hairline {
    position: absolute; bottom: 80px; left: 120px; right: 120px;
    height: 1px; background: var(--sf-hairline);
  }
  .page-num {
    position: absolute; bottom: 56px; right: 120px;
    font-size: 13px; color: var(--sf-page-num);
  }

  body.layout-grid-3 .kp-list {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; flex: unset;
  }
  body.layout-grid-3 .kp-item {
    flex-direction: column; align-items: flex-start; gap: 14px; padding: 28px 28px;
    border-radius: 16px; border: 1px solid var(--sf-card-muted-border);
    border-bottom: 1px solid var(--sf-card-muted-border); background: var(--sf-card-muted-bg);
  }
  body.layout-sidebar-left .panel {
    display: grid; grid-template-columns: 280px 1fr;
    grid-template-rows: auto 1fr; gap: 0 56px;
  }
  body.layout-sidebar-left .panel-eyebrow { grid-column:1; grid-row:1; }
  body.layout-sidebar-left .panel-title   { grid-column:1; grid-row:2; font-size:32px; align-self:start; margin-bottom:0; }
  body.layout-sidebar-left .kp-list       { grid-column:2; grid-row:1/3; }
  body.layout-cards .kp-list { gap: 16px; }
  body.layout-cards .kp-item {
    padding: 20px 28px; border-radius: 12px;
    border: 1px solid var(--sf-card-muted-border); border-bottom: 1px solid var(--sf-card-muted-border);
    background: var(--sf-card-muted-bg);
  }
  body.layout-cards .kp-item {
    border-top: 2px solid color-mix(in srgb, var(--sf-accent) 35%, transparent);
  }
  body.layout-numbered .kp-list { counter-reset: kp-item; }
  body.layout-numbered .kp-item { counter-increment: kp-item; }
  body.layout-numbered .kp-arrow {
    background: transparent !important; box-shadow: none !important;
    border-radius: 0 !important; width: auto !important; height: auto !important;
    font-size: 20px; font-weight: 800; letter-spacing: 0.05em; opacity: 0.7;
  }
  body.layout-numbered .kp-arrow::before { content: counter(kp-item, decimal-leading-zero); }

  body.vp-comp-split-visual {
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  body.vp-comp-split-visual .slide-split {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(480px, 560px);
    gap: 56px;
    flex: 1;
    align-items: stretch;
    min-height: 0;
    margin-top: 8px;
  }
  body.vp-comp-split-visual .panel {
    margin-top: 0;
    min-height: 420px;
  }
  .vp-visual-slot {
    display: none;
    border-radius: 28px;
    border: var(--sf-visual-slot-border);
    background: var(--sf-visual-slot-bg);
    box-shadow: var(--sf-visual-slot-shadow);
    position: relative;
    overflow: hidden;
  }
  body.vp-comp-split-visual .vp-visual-slot {
    display: flex;
    align-items: flex-end;
    justify-content: flex-start;
    padding: 32px 36px;
    min-height: 420px;
  }
  body.vp-comp-split-visual .vp-visual-slot::before {
    content: '';
    position: absolute;
    inset: 24px;
    border-radius: 16px;
    border: var(--sf-visual-slot-frame-border);
    background:
      repeating-linear-gradient(0deg, transparent, transparent 47px, var(--sf-visual-slot-grid-line-a) 47px, var(--sf-visual-slot-grid-line-a) 48px),
      repeating-linear-gradient(90deg, transparent, transparent 47px, var(--sf-visual-slot-grid-line-b) 47px, var(--sf-visual-slot-grid-line-b) 48px);
    pointer-events: none;
  }
  body.vp-comp-split-visual .vp-visual-slot::after {
    content: '';
    position: absolute;
    top: 28%; left: 18%; right: 18%;
    height: 42%;
    border-radius: 12px;
    background: var(--sf-visual-slot-bar);
    box-shadow: var(--sf-visual-slot-bar-shadow);
    pointer-events: none;
  }
  .vp-visual-slot-label {
    position: relative; z-index: 2;
    font-size: 12px; font-weight: 600; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--sf-visual-slot-label);
  }
  .vp-visual-slot:has(img)::after { display: none; }
  .vp-visual-slot:has(img) .vp-visual-slot-label { display: none; }

  .kp-content { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 0; }
  .kp-title   { font-size: inherit; font-weight: 600; line-height: 1.3; }
  .kp-desc    { font-size: 0.72em; opacity: 0.65; line-height: 1.55; }
  body.layout-grid-3  .kp-item { align-items: flex-start; }
  body.layout-cards   .kp-item { align-items: flex-start; }

  body.vp-closing {
    justify-content: center;
    padding-top: 96px;
    padding-bottom: 96px;
  }
  body.vp-closing .title {
    font-size: var(--sf-title-size, clamp(64px, 4.8vw, 88px));
    text-align: center;
    max-width: 1100px;
    margin-left: auto;
    margin-right: auto;
    margin-bottom: 52px;
  }
  body.vp-closing .panel {
    background: transparent;
    border: none;
    box-shadow: none;
    backdrop-filter: none;
    padding: 0;
  }
  body.vp-closing.layout-cards .kp-list {
    gap: 18px;
    align-items: center;
    max-width: 880px;
    margin: 0 auto;
  }
  body.vp-closing.layout-cards .kp-item {
    flex: unset;
    width: 100%;
    justify-content: center;
    padding: 20px 40px;
    border-radius: 100px;
    border: var(--sf-cta-pill-border);
    background: var(--sf-cta-pill-bg);
    font-size: 24px;
    border-bottom: none;
  }
  body.vp-closing.layout-cards .kp-arrow { display: none; }
  </style>

  --sf-cover-title-glow: none;

  --sf-page-bg-text: #ffffff;

  --sf-page-bg-number: #ffffff;
  --sf-page-bg-stats: #ffffff;
  --sf-page-bg-compare: #ffffff;

  --sf-kp-text: #1d1818;

  --sf-visual-slot-border: 1px solid rgba(29, 24, 24, 0.12);

  --sf-visual-slot-grid-line-a: rgba(29, 24, 24, 0.08);

  --sf-visual-slot-frame-border: 1px solid rgba(29, 24, 24, 0.12);

  --sf-cta-pill-bg: rgba(29, 24, 24, 0.04);

  /* 办公模板字号（1920×1080 画布，对照 PPT pt×2） */
  --sf-heytea-cover-title: 60px;
  --sf-heytea-cover-subtitle: 32px;
  --sf-heytea-content-title: 40px;
  --sf-heytea-body: 32px;
  --sf-heytea-closing-title: 48px;
}
</style>

<style id="vp-variant-hover">
@media (hover: hover) and (pointer: fine) {
  .panel ul.kp-list > li.kp-item {
    transition: outline-color 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
    outline: 2px solid transparent;
    outline-offset: 2px;
    border-radius: 10px;
  }
  .panel ul.kp-list > li.kp-item:hover {
    outline-color: rgba(255,255,255,0.28);
    background-color: rgba(255,255,255,0.06);
    box-shadow: 0 6px 24px rgba(0,0,0,0.22);
  }
}
</style><style id="vp-page-anim-style">

@keyframes vp-fade-up {
  from { opacity: 0; transform: translateY(18px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes vp-block-in {
  from { opacity: 0; transform: translateY(14px); }
  to { opacity: 1; transform: translateY(0); }
}

@media (prefers-reduced-motion: reduce) {
  body.vp-page-anim,
  body.vp-page-anim [data-vp-animate],
  body.vp-page-anim.vp-anim-preset-fade > *:not(.page-num):not(.hairline):not(.vp-footnote) {
    animation: none !important;
    opacity: 1 !important;
    transform: none !important;
  }
}
body.vp-page-anim.vp-anim-preset-stagger [data-vp-animate] {
  opacity: 0;
  animation: vp-block-in 0.48s cubic-bezier(0.22, 1, 0.36, 1) forwards;
}
</style>
<script id="vp-page-anim-boot">(function(){
  function done(){
    if(document.body){
      document.body.setAttribute('data-vp-anim-ready','1');
      try{ window.dispatchEvent(new CustomEvent('vp-anim-ready')); }catch(e){}
    }
  }
  function run(){
    if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches){
      done(); return;
    }
    setTimeout(done, 1600);
  }
  if(document.readyState==='complete') run();
  else window.addEventListener('load', run);
})();</script>
