<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, height=1080">
<title>核心指标</title>
<style>
  /* _core · stats_grid · wave6 */
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { width: 1920px; height: 1080px; overflow: hidden; }

  body {
    width: 1920px; height: 1080px;
    background: var(--sf-page-bg-stats);
    font-family: var(--sf-font);
    color: var(--sf-text-primary);
    padding: 80px 120px;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .eyebrow {
    font-size: 13px; font-weight: 600; letter-spacing: 0.2em;
    color: var(--sf-eyebrow); text-transform: uppercase; margin-bottom: 20px;
  }
  .eyebrow:empty { display: none; }
  .title {
    font-size: var(--sf-title-size, 58px); font-weight: 700; line-height: 1.05;
    letter-spacing: -0.03em; margin-bottom: 56px; max-width: 900px;
  }
  .stats-row {
    display: flex;
    gap: 28px;
    align-items: stretch;
    max-width: 1680px;
  }
  .stat-card {
    flex: 1;
    background: var(--sf-stats-card-bg);
    border: var(--sf-stats-card-border);
    border-top: var(--sf-stats-card-border-top);
    border-radius: var(--sf-panel-radius, 22px);
    box-shadow: var(--sf-stats-card-shadow);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    padding: 36px 40px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .stat-card .stat-number {
    font-size: var(--sf-stat-number-size, clamp(72px, 8vw, 120px));
    font-weight: 700; line-height: 1;
    letter-spacing: -0.04em; color: var(--sf-accent);
    text-shadow: var(--sf-stats-number-shadow);
  }
  .stat-unit {
    font-size: 34px; font-weight: 400; color: var(--sf-text-muted);
    margin-left: 6px; vertical-align: super;
  }
  .stat-label {
    font-size: 22px; font-weight: 600; color: var(--sf-stats-label); line-height: 1.35;
  }
  .stat-desc {
    font-size: 16px; color: var(--sf-stats-desc); line-height: 1.5;
  }
  .hairline {
    position: absolute; bottom: 80px; left: 120px; right: 120px; height: 1px;
    background: var(--sf-hairline-gradient);
  }
  .page-num {
    position: absolute; bottom: 56px; right: 120px;
    font-size: 13px; color: var(--sf-page-num);
  }

  body.layout-row .stats-row {
    display: flex;
    gap: 24px;
    align-items: stretch;
  }
  body.layout-hero-1 .stats-row { gap: 24px; align-items: stretch; }
  body.layout-hero-1 .stat-card:first-child {
    flex: 1.65;
    border-color: var(--sf-stats-hero-border);
    box-shadow: var(--sf-stats-hero-shadow);
  }
  body.layout-hero-1 .stat-card:not(:first-child) { opacity: 0.92; }
  body.layout-hero-1 .stat-card:not(:first-child) .stat-label { font-size: 20px; }
  body.layout-hero-1 .stat-card:first-child .stat-number {
    font-size: clamp(120px, 10vw, 168px);
  }
  body.layout-hero-1 .stat-card:not(:first-child) .stat-number { font-size: 64px; }
  body.vp-comp-stat-hero.layout-hero-1 .stat-card:first-child .stat-number {
    font-size: clamp(140px, 11vw, 190px);
  }
  body.layout-2x2 .stats-row {
    display: grid; grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr; gap: 24px; max-width: 1400px;
  }
  body.layout-2x2 .stat-card { flex: unset; }
</style>
<style id="sf-heytea-fonts">
/* 喜茶办公模板内置字体 — 渲染时复制到 heytea-assets/fonts/ */
@font-face {
  font-family: 'FZFW ZhuZi Hei R';
  src: url('heytea-assets/fonts/FZFWZhuZiHeiR.ttf') format('truetype');
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}

@font-face {
  font-family: 'Heytea Sans Serif';
  src: url('heytea-assets/fonts/HeyteaSansSerif-Regular.otf') format('opentype');
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}
</style>
<style id="sf-heytea-typography">
/* heytea 办公字号 / 字距（叠加 _core · shared 变体，不限制版式） */
body.vp-cover .title {
  font-size: var(--sf-heytea-cover-title, 60px) !important;
  font-weight: 400;
  line-height: 1 !important;
  letter-spacing: 1px;
}
body.vp-cover .subtitle {
  font-size: var(--sf-heytea-cover-subtitle, 32px) !important;
  line-height: 1 !important;
  letter-spacing: 1px;
}

body:not(.vp-cover):not(.vp-heytea-closing-fixed) .title {
  font-size: var(--sf-heytea-content-title, 40px) !important;
  font-weight: 400;
  line-height: 1 !important;
  letter-spacing: 1px;
}

body:not(.vp-cover):not(.vp-heytea-closing-fixed) .kp-item,
body:not(.vp-cover):not(.vp-heytea-closing-fixed) .body-text,
body:not(.vp-cover):not(.vp-heytea-closing-fixed) .panel-body,
body:not(.vp-cover):not(.vp-heytea-closing-fixed) .col-body,
body:not(.vp-cover):not(.vp-heytea-closing-fixed) .stat-label,
body:not(.vp-cover):not(.vp-heytea-closing-fixed) .quote-body {
  font-size: var(--sf-heytea-body, 32px);
  line-height: 1.5;
  letter-spacing: 0.5px;
}

body:not(.vp-cover):not(.vp-heytea-closing-fixed) .big-number,
body:not(.vp-cover):not(.vp-heytea-closing-fixed) .stat-value {
  font-family: var(--sf-font-latin, var(--sf-font));
}
</style>
<style id="sf-heytea-cover-brand">
/* 喜茶办公封面固定 logo（对照 PPT layout1 · image1）
 * 画布 1920×1080：left 841px · top 139px · 237×237 */
body.vp-heytea-cover .heytea-cover-logo {
  position: absolute;
  top: 139px;
  left: 841px;
  width: 237px;
  height: 237px;
  object-fit: contain;
  pointer-events: none;
  z-index: 6;
}
</style>
<style id="sf-theme-tokens">
/* heytea — 喜茶办公横版模板（对照 PPT 11.26）
 * 内置字体见 fonts.css + samples/themes/heytea/fonts/
 * 中文：方正 FW 筑紫黑 R · 数字/英文：Heytea Sans Serif Regular
 */
:root {
  --sf-font: 'FZFW ZhuZi Hei R', 'Heytea Sans Serif', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --sf-font-zh: 'FZFW ZhuZi Hei R', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --sf-font-latin: 'Heytea Sans Serif', 'PingFang SC', sans-serif;
  --sf-body-bg: #ffffff;
  --sf-body-gradient: #ffffff;
  --sf-text-primary: #1d1818;
  --sf-text-secondary: #1d1818;
  --sf-text-muted: #6b6565;
  --sf-text-subtitle: #4a4545;
  --sf-accent: #1d1818;
  --sf-accent-secondary: #1d1818;
  --sf-accent-light: #3d3838;
  --sf-eyebrow: #6b6565;
  --sf-eyebrow-ring: none;
  --sf-subtitle-lede: #4a4545;
  --sf-page-num: rgba(29, 24, 24, 0.45);

  --sf-panel-bg: transparent;
  --sf-panel-border: none;
  --sf-panel-border-top: none;
  --sf-panel-border-bottom: none;
  --sf-panel-shadow: none;
  --sf-panel-radius: 0;

  --sf-hairline: rgba(29, 24, 24, 0.12);
  --sf-hairline-gradient: rgba(29, 24, 24, 0.12);

  --sf-cover-bg: #ffffff;
  --sf-corner-accent: none;
  --sf-bottom-line-gradient: none;
  --sf-accent-bar-gradient: none;
  --sf-cover-title-glow: none;

  --sf-page-bg-text: #ffffff;
  --sf-page-bg-panel: #ffffff;
  --sf-page-bg-number: #ffffff;
  --sf-page-bg-stats: #ffffff;
  --sf-page-bg-compare: #ffffff;
  --sf-page-bg-process: #ffffff;
  --sf-page-bg-quote: #ffffff;

  --sf-kp-text: #1d1818;
  --sf-kp-divider: rgba(29, 24, 24, 0.08);
  --sf-kp-arrow-glow: none;
  --sf-card-muted-border: none;
  --sf-card-muted-bg: transparent;

  --sf-visual-slot-border: 1px solid rgba(29, 24, 24, 0.12);
  --sf-visual-slot-bg: #fafafa;
  --sf-visual-slot-shadow: none;
  --sf-visual-slot-grid-line-a: rgba(29, 24, 24, 0.08);
  --sf-visual-slot-grid-line-b: rgba(29, 24, 24, 0.04);
  --sf-visual-slot-bar: rgba(29, 24, 24, 0.06);
  --sf-visual-slot-bar-shadow: none;
  --sf-visual-slot-frame-border: 1px solid rgba(29, 24, 24, 0.12);
  --sf-visual-slot-label: rgba(29, 24, 24, 0.55);

  --sf-cta-pill-border: 1px solid rgba(29, 24, 24, 0.2);
  --sf-cta-pill-bg: rgba(29, 24, 24, 0.04);

  /* 办公模板字号（1920×1080 画布，对照 PPT pt×2） */
  --sf-heytea-cover-title: 60px;
  --sf-heytea-cover-subtitle: 32px;
  --sf-heytea-content-title: 40px;
  --sf-heytea-body: 32px;
  --sf-heytea-closing-title: 48px;
}
</style>
<style id="sf-q1-visual">
/* Q1-B — visual slot (injected by html_generator) */
.vp-visual-slot .vp-hero-image,
.vp-visual-slot .vp-diagram-image,
.vp-visual-slot .vp-brand-mark {
  position: relative;
  z-index: 2;
}
.vp-visual-slot:has(.vp-hero-image)::before,
.vp-visual-slot:has(.vp-hero-image)::after,
.vp-visual-slot:has(.vp-diagram-image)::before,
.vp-visual-slot:has(.vp-diagram-image)::after {
  display: none !important;
}
.vp-visual-slot:has(.vp-hero-image) .vp-visual-slot-label {
  z-index: 3;
}

</style>
<style>
  /* slide-forge: art direction (Q0) */
  body.vp-vw-hero:not(.vp-cover) .title,
  body.vp-vw-hero:not(.vp-cover) .section-title {
    font-size: clamp(72px, 5vw, 96px) !important;
    line-height: 1.02 !important;

  }
  body.vp-vw-hero .panel,
  body.vp-vw-hero .big-number,
  body.vp-vw-hero .quote-text {
    transform: translateZ(0);
  }
  body.vp-vw-breathing {
    padding-top: 120px !important;
    padding-bottom: 120px !important;
  }
  body.vp-vw-breathing .title {
    font-size: clamp(56px, 4vw, 80px) !important;
    line-height: 1.08 !important;
    max-width: 1400px !important;
  }
  body.vp-vw-breathing .eyebrow,
  body.vp-vw-breathing .label {
    margin-bottom: 32px !important;
  }
  body.vp-vw-dense .title {
    font-size: clamp(48px, 3.2vw, 64px) !important;
    margin-bottom: 24px !important;
  }
  body.vp-comp-title-only .panel,
  body.vp-comp-title-only .kp-list,
  body.vp-comp-title-only .grid,
  body.vp-comp-title-only .body-text,
  body.vp-comp-title-only .stat-row,
  body.vp-comp-title-only .compare-grid,
  body.vp-comp-title-only .pf-track,
  body.vp-comp-title-only .arch-stack {
    display: none !important;
  }
  body.vp-comp-title-only .title {
    font-size: clamp(64px, 4.5vw, 88px) !important;
    max-width: 1500px !important;
  }
  body.vp-comp-title-only .secondary {
    font-size: 36px !important;
    opacity: 0.85 !important;
    margin-top: 24px !important;
  }
  body.vp-comp-stat-hero .big-number,
  body.vp-comp-stat-hero .number,
  body.vp-comp-stat-hero .stat-number {
    font-size: clamp(140px, 12vw, 220px) !important;
    line-height: 0.95 !important;
  }
  body.vp-comp-stat-hero .number-label,
  body.vp-comp-stat-hero .stat-label,
  body.vp-comp-stat-hero .stat-headline {
    font-size: 32px !important;
  }
  /* split-visual: prefer theme .slide-split + .vp-visual-slot; disable legacy body::after */
  body.vp-comp-split-visual::after {
    content: none !important;
    display: none !important;
  }

  </style>
<style id="sf-typo-vars">
:root {
  --sf-title-size: clamp(64px, 4.8vw, 88px);
}
</style>
<style id="vp-page-anim-style">

@keyframes vp-fade-up {
  from { opacity: 0; transform: translateY(18px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes vp-block-in {
  from { opacity: 0; transform: translateY(14px); }
  to { opacity: 1; transform: translateY(0); }
}

@media (prefers-reduced-motion: reduce) {
  body.vp-page-anim,
  body.vp-page-anim [data-vp-animate],
  body.vp-page-anim.vp-anim-preset-fade > *:not(.page-num):not(.hairline):not(.vp-footnote) {
    animation: none !important;
    opacity: 1 !important;
    transform: none !important;
  }
}
body.vp-page-anim.vp-anim-preset-stagger [data-vp-animate] {
  opacity: 0;
  animation: vp-block-in 0.48s cubic-bezier(0.22, 1, 0.36, 1) forwards;
}
</style>
<script id="vp-page-anim-boot">(function(){
  function done(){
    if(document.body){
      document.body.setAttribute('data-vp-anim-ready','1');
      try{ window.dispatchEvent(new CustomEvent('vp-anim-ready')); }catch(e){}
    }
  }
  function run(){
    if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches){
      done(); return;
    }
    setTimeout(done, 1600);
  }
  if(document.readyState==='complete') run();
  else window.addEventListener('load', run);
})();</script>
</head>

</div>

</div>
<div class="stat-card" data-vp-animate style="animation-delay:0.16s">
  <div class="stat-number"></div>
  <div class="stat-label">响应时效</div>
</div>
<div class="stat-card" data-vp-animate style="animation-delay:0.22s">
  <div class="stat-number"></div>
  <div class="stat-label">复购率</div>
</div></div>
  <div class="hairline"></div>
  <span class="page-num">03 / 04</span>
</body>
