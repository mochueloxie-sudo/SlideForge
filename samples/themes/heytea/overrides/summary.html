<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, height=1080">
<title>结束页</title>
<style>
  /* 喜茶办公模板 · 尾页固定（与 PPT/PDF 第 3 页一致，不可改文案） */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1920px; height: 1080px;
    overflow: hidden;
    background: #ffffff;
  }
  .closing-fixed {
    display: block;
    width: 1920px;
    height: 1080px;
    object-fit: fill;
    pointer-events: none;
    user-select: none;
  }
</style>
</head>
<body class="vp-heytea-closing vp-heytea-closing-fixed">
  <img class="closing-fixed" src="heytea-assets/closing-slide.png" alt="" width="1920" height="1080" />
</body>
</html>
