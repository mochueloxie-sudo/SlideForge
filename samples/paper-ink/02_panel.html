<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, height=1080">
<title>{{TITLE}}</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Source+Serif+4:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { width: 1920px; height: 1080px; overflow: hidden; }

  body {
    width: 1920px; height: 1080px;
    background: #faf9f7;
    font-family: 'Source Serif 4', Georgia, serif;
    color: #1a1a1a;
    display: flex; flex-direction: column;
    position: relative; overflow: hidden;
  }
  .crimson-bar { width: 100%; height: 5px; background: #c41e3a; flex-shrink: 0; }
  .main {
    flex: 1;
    padding: 52px 120px 72px 140px;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .eyebrow {
    font-size: 12px; letter-spacing: 0.28em;
    color: #c41e3a; text-transform: uppercase;
    font-variant: small-caps; margin-bottom: 12px;
    flex-shrink: 0;
  }
  .eyebrow:empty { display: none; }
  .rule-thin { width: 60px; height: 1px; background: #d8d2c8; margin-bottom: 22px; flex-shrink: 0; }
  .title {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 58px; font-weight: 300; line-height: 1.1;
    color: #1a1a1a; margin-bottom: 28px;
    flex-shrink: 0; font-style: italic;
  }
  .panel {
    background: #f0ede8;
    border-left: 3px solid #c41e3a;
    border-top: 1px solid #c8c0b4;
    border-bottom: 1px solid #c8c0b4;
    border-right: 1px solid #c8c0b4;
    padding: 36px 44px;
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .panel-eyebrow {
    font-size: 11px; letter-spacing: 0.24em;
    color: #c41e3a; text-transform: uppercase;
    font-variant: small-caps; margin-bottom: 10px;
  }
  .panel-eyebrow:empty { display: none; }
  .panel-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 28px; font-weight: 600;
    color: #1a1a1a; margin-bottom: 20px;
  }
  .panel-title:empty { display: none; margin-bottom: 0; }
  .kp-list { list-style: none; display: flex; flex-direction: column; flex: 1; }
  .kp-item {
    display: flex; align-items: center; gap: 18px;
    font-size: {{KP_FONT_SIZE}}px; line-height: 1.55; color: #3a3530;
    flex: 1; border-bottom: 1px solid #ddd6cc;
  }
  .kp-item:last-child { border-bottom: none; }
  .kp-arrow {
    flex-shrink: 0; width: {{KP_DOT_SIZE}}px; height: {{KP_DOT_SIZE}}px;
    background: #c41e3a; border-radius: 2px;
  }
  .bottom-rule {
    height: 1px; background: #d8d2c8;
    position: absolute; bottom: 52px; left: 140px; right: 80px;
  }
  .page-num {
    position: absolute; bottom: 28px; left: 50%;
    transform: translateX(-50%);
    font-size: 12px; color: #8a837c; letter-spacing: 0.12em;
  }

  body.layout-grid-3 .kp-list {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; flex: unset;
  }
  body.layout-grid-3 .kp-item {
    flex-direction: column; align-items: flex-start; gap: 12px;
    padding: 24px; border: 1px solid #ddd6cc; border-radius: 4px;
    background: #faf9f7;
  }
  body.layout-sidebar-left .panel {
    display: grid; grid-template-columns: 240px 1fr;
    grid-template-rows: auto 1fr; gap: 0 48px;
  }
  body.layout-sidebar-left .panel-eyebrow { grid-column: 1; grid-row: 1; }
  body.layout-sidebar-left .panel-title { grid-column: 1; grid-row: 2; align-self: start; margin-bottom: 0; }
  body.layout-sidebar-left .kp-list { grid-column: 2; grid-row: 1 / 3; }
  body.layout-cards .kp-list { gap: 14px; }
  body.layout-cards .kp-item {
    flex: unset; padding: 18px 28px;
    border: 1px solid #ddd6cc; border-radius: 4px;
    background: #faf9f7;
  }
  body.layout-numbered .kp-list { counter-reset: kp-item; }
  body.layout-numbered .kp-item { counter-increment: kp-item; }
  body.layout-numbered .kp-arrow {
    background: transparent !important; width: auto !important; height: auto !important;
    font-size: 18px; font-weight: 700; color: #c41e3a; font-family: 'Cormorant Garamond', serif;
  }
  body.layout-numbered .kp-arrow::before { content: counter(kp-item, decimal-leading-zero) '.'; }

  body:not(.vp-comp-split-visual) .slide-split {
    display: block;
    flex: 1;
    min-height: 0;
  }
  body:not(.vp-comp-split-visual) .vp-visual-slot { display: none !important; }

  body.vp-comp-split-visual .main { padding-bottom: 56px; }
  body.vp-comp-split-visual .slide-split {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(440px, 520px);
    gap: 48px;
    flex: 1;
    align-items: stretch;
    min-height: 0;
  }
  body.vp-comp-split-visual .panel { margin-top: 0; min-height: 380px; }
  .vp-visual-slot {
    display: none;
    border-radius: 4px;
    border: 1px solid #c8c0b4;
    background: #f5f2ec;
    box-shadow: 0 2px 12px rgba(26, 26, 26, 0.06);
    position: relative;
    overflow: hidden;
    min-height: 380px;
  }
  body.vp-comp-split-visual .vp-visual-slot {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .vp-visual-slot img,
  .vp-visual-slot svg {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }
  .vp-visual-slot-label { display: none; }

  body.vp-closing .main {
    justify-content: center;
    padding-top: 80px;
    padding-bottom: 80px;
  }
  body.vp-closing .title {
    font-size: clamp(56px, 4.5vw, 80px);
    text-align: center;
    margin-left: auto;
    margin-right: auto;
    max-width: 1000px;
    margin-bottom: 44px;
  }
  body.vp-closing .panel {
    background: transparent;
    border: none;
    padding: 0;
  }
  body.vp-closing.layout-cards .kp-list {
    gap: 16px;
    align-items: center;
    max-width: 820px;
    margin: 0 auto;
  }
  body.vp-closing.layout-cards .kp-item {
    justify-content: center;
    padding: 18px 36px;
    border-radius: 4px;
    border: 1px solid #c8c0b4;
    background: #f0ede8;
    font-size: 22px;
  }
  body.vp-closing.layout-cards .kp-arrow { display: none; }
</style>
</head>
<body>
<div class="crimson-bar"></div>
<div class="main">
  <div class="eyebrow">{{EYEBROW}}</div>
  <div class="rule-thin"></div>
  <h1 class="title">{{TITLE}}</h1>
  <div class="slide-split">
    <div class="panel">
      <div class="panel-eyebrow">{{PANEL_EYEBROW}}</div>
      <div class="panel-title">{{PANEL_TITLE}}</div>
      <ul class="kp-list">
        {{KEY_POINTS_HTML}}
      </ul>
    </div>
    <aside class="vp-visual-slot" aria-label="主视觉">
      <span class="vp-visual-slot-label">Figure</span>
    </aside>
  </div>
</div>
<div class="bottom-rule"></div>
<div class="page-num">{{PAGE_NUM}} / {{TOTAL}}</div>
</body>
</html>
