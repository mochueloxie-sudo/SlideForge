<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, height=1080">
<title>{{TITLE}}</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600&family=Source+Serif+4:ital,wght@0,400;0,600&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { width: 1920px; height: 1080px; overflow: hidden; }

  body {
    width: 1920px; height: 1080px;
    background: #faf9f7;
    font-family: 'Source Serif 4', Georgia, serif;
    color: #1a1a1a;
    padding: 80px 120px 80px 140px;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .crimson-bar { position: absolute; top: 0; left: 0; right: 0; height: 5px; background: #c41e3a; }
  .eyebrow {
    font-size: 12px; letter-spacing: 0.28em;
    color: #c41e3a; text-transform: uppercase;
    font-variant: small-caps; margin-bottom: 18px;
  }
  .eyebrow:empty { display: none; }
  .title {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: var(--sf-title-size, 56px); font-weight: 400; font-style: italic;
    line-height: 1.08; margin-bottom: 48px; max-width: 920px;
  }
  .stats-row {
    display: flex;
    gap: 24px;
    align-items: stretch;
    max-width: 1640px;
  }
  .stat-card {
    flex: 1;
    background: #f0ede8;
    border: 1px solid #c8c0b4;
    border-left: 3px solid #c8c0b4;
    border-radius: 4px;
    padding: 32px 36px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .stat-number {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 80px; font-weight: 600; line-height: 1;
    letter-spacing: -0.03em; color: #c41e3a;
  }
  .stat-unit {
    font-size: 28px; font-weight: 400; color: #6a6560;
    margin-left: 4px;
  }
  .stat-label {
    font-size: 20px; font-weight: 600; color: #2a2520; line-height: 1.35;
  }
  .stat-desc {
    font-size: 15px; color: #5a554e; line-height: 1.5;
  }
  .hairline {
    position: absolute; bottom: 80px; left: 140px; right: 120px; height: 1px;
    background: #d8d2c8;
  }
  .page-num {
    position: absolute; bottom: 56px; right: 120px;
    font-size: 12px; color: #8a857e;
  }

  body.layout-hero-1 .stats-row { gap: 22px; }
  body.layout-hero-1 .stat-card:first-child {
    flex: 1.7;
    border-left-color: #c41e3a;
    background: #faf6f2;
    box-shadow: 0 12px 40px rgba(196, 30, 58, 0.08);
  }
  body.layout-hero-1 .stat-card:first-child .stat-number {
    font-size: clamp(108px, 9vw, 152px);
  }
  body.layout-hero-1 .stat-card:not(:first-child) .stat-number { font-size: 58px; }
  body.vp-comp-stat-hero.layout-hero-1 .stat-card:first-child .stat-number {
    font-size: clamp(120px, 10vw, 168px);
  }
  body.layout-2x2 .stats-row {
    display: grid; grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr; gap: 22px; max-width: 1320px;
  }
  body.layout-2x2 .stat-card { flex: unset; }
</style>
</head>
<body>
  <div class="crimson-bar"></div>
  <div class="eyebrow">{{EYEBROW}}</div>
  <h1 class="title">{{TITLE}}</h1>
  <div class="stats-row">{{STATS_HTML}}</div>
  <div class="hairline"></div>
  <span class="page-num">{{PAGE_NUM}} / {{TOTAL}}</span>
</body>
</html>
