<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, height=1080">
<title>{{TITLE}}</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600&family=Source+Serif+4:ital,wght@0,400;0,600&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { width: 1920px; height: 1080px; overflow: hidden; }

  body {
    width: 1920px; height: 1080px;
    background: #faf9f7;
    font-family: 'Source Serif 4', Georgia, serif;
    color: #1a1a1a;
    padding: 80px 120px 80px 140px;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .crimson-bar { position: absolute; top: 0; left: 0; right: 0; height: 5px; background: #c41e3a; }
  .eyebrow {
    font-size: 12px; letter-spacing: 0.28em;
    color: #c41e3a; text-transform: uppercase;
    font-variant: small-caps; margin-bottom: 18px;
  }
  .eyebrow:empty { display: none; }
  .title {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: var(--sf-title-size, 54px); font-weight: 400; font-style: italic;
    line-height: 1.08; margin-bottom: 44px; max-width: 1100px;
  }
  .compare-grid {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 36px;
    align-items: stretch;
    max-width: 1640px;
  }
  .compare-col {
    background: #f0ede8;
    border: 1px solid #c8c0b4;
    border-top: 1px solid #d8d2c8;
    border-radius: 4px;
    padding: 36px 40px;
    display: flex;
    flex-direction: column;
    min-height: 460px;
  }
  .compare-col-right {
    border-left: 3px solid #c41e3a;
    background: #faf6f2;
    box-shadow: 0 10px 36px rgba(196, 30, 58, 0.07);
  }
  .compare-col-title {
    font-size: 11px; letter-spacing: 0.22em;
    text-transform: uppercase; font-variant: small-caps;
    margin-bottom: 24px; padding-bottom: 14px;
    border-bottom: 1px solid #d8d2c8;
  }
  .compare-col-left .compare-col-title { color: #6a6560; }
  .compare-col-right .compare-col-title { color: #c41e3a; }
  .compare-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 18px;
    flex: 1;
  }
  .compare-list li {
    display: flex; align-items: flex-start; gap: 14px;
    font-size: 22px; line-height: 1.5; color: #3a3530;
  }
  .compare-dot {
    width: 7px; height: 7px; border-radius: 1px;
    margin-top: 11px; flex-shrink: 0;
  }
  .compare-col-left .compare-dot { background: #a8a29a; }
  .compare-col-right .compare-dot { background: #c41e3a; }
  .compare-center { display: flex; align-items: center; justify-content: center; }
  .compare-vs {
    width: 72px; height: 72px; border-radius: 50%;
    border: 2px solid #c41e3a;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Cormorant Garamond', serif;
    font-size: 20px; font-weight: 600; color: #c41e3a;
    background: #faf9f7;
  }
  .hairline {
    position: absolute; bottom: 80px; left: 140px; right: 120px; height: 1px;
    background: #d8d2c8;
  }
  .page-num {
    position: absolute; bottom: 56px; right: 120px;
    font-size: 12px; color: #8a857e;
  }
  body.layout-wide-left .compare-grid { grid-template-columns: 1.2fr auto 0.9fr; }
  body.layout-wide-right .compare-grid { grid-template-columns: 0.9fr auto 1.2fr; }
</style>
</head>
<body>
  <div class="crimson-bar"></div>
  <div class="eyebrow">{{EYEBROW}}</div>
  <h1 class="title">{{TITLE}}</h1>
  <div class="compare-grid">
    <div class="compare-col compare-col-left">
      <div class="compare-col-title">{{COMPARE_LEFT_TITLE}}</div>
      <ul class="compare-list">{{COMPARE_LEFT_POINTS}}</ul>
    </div>
    <div class="compare-center">
      <div class="compare-vs">{{COMPARE_CENTER_LABEL}}</div>
    </div>
    <div class="compare-col compare-col-right">
      <div class="compare-col-title">{{COMPARE_RIGHT_TITLE}}</div>
      <ul class="compare-list">{{COMPARE_RIGHT_POINTS}}</ul>
    </div>
  </div>
  <div class="hairline"></div>
  <span class="page-num">{{PAGE_NUM}} / {{TOTAL}}</span>
</body>
</html>
