<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, height=1080">
<title>{{TITLE}}</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { width: 1920px; height: 1080px; overflow: hidden; }

  body {
    width: 1920px; height: 1080px;
    background: var(--sf-page-bg-text);
    font-family: var(--sf-font);
    color: var(--sf-text-primary);
    padding: 80px 120px;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
  }
  .section-num {
    font-size: 13px; font-weight: 600; letter-spacing: 0.18em;
    color: var(--sf-eyebrow); text-transform: uppercase; margin-bottom: 28px;
  }
  .section-num:empty { display: none; }
  .title {
    font-size: var(--sf-title-size, 58px); font-weight: 700; line-height: 1.06;
    letter-spacing: -0.03em; color: var(--sf-text-primary);
    margin-bottom: 32px; max-width: 1400px;
  }
  .body-text {
    font-size: 26px; font-weight: 400; line-height: 1.68;
    color: var(--sf-text-secondary); max-width: 920px; margin-bottom: 24px;
  }
  .body-text:empty { display: none; margin: 0; }
  .secondary {
    font-size: 26px; line-height: 1.65;
    color: var(--sf-kp-text); max-width: 920px;
  }
  .secondary:empty { display: none; }
  .hairline {
    position: absolute; bottom: 80px; left: 120px; right: 120px;
    height: 1px;
    background: var(--sf-hairline-gradient);
  }
  .page-num {
    position: absolute; bottom: 56px; right: 120px;
    font-size: 13px; color: var(--sf-page-num);
  }

  /* breathing / title-only — editorial pacing (Q0) */
  body.vp-vw-breathing,
  body.vp-comp-title-only {
    justify-content: center;
    padding-top: 100px;
    padding-bottom: 100px;
  }
  body.vp-vw-breathing .title,
  body.vp-comp-title-only .title {
    font-size: var(--sf-title-size, clamp(64px, 5vw, 92px));
    line-height: 1.04;
    letter-spacing: -0.035em;
    max-width: 1500px;
    margin-bottom: 0;
  }
  body.vp-comp-title-only .body-text { display: none !important; }
  body.vp-comp-title-only .secondary {
    font-size: clamp(28px, 2.2vw, 38px);
    line-height: 1.5;
    color: var(--sf-accent);
    opacity: 0.92;
    margin-top: 36px;
    max-width: 1100px;
  }
  body.vp-vw-breathing .section-num { margin-bottom: 36px; }
</style>
</head>
<body>
  <div class="section-num">{{EYEBROW}}</div>
  <h1 class="title">{{TITLE}}</h1>
  <p class="body-text">{{BODY}}</p>
  <p class="secondary">{{SECONDARY}}</p>
  <div class="hairline"></div>
  <span class="page-num">{{PAGE_NUM}} / {{TOTAL}}</span>
</body>
</html>
