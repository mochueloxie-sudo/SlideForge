<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, height=1080">
<title>{{TITLE}}</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { width: 1920px; height: 1080px; overflow: hidden; }

  body {
    width: 1920px; height: 1080px;
    background: var(--sf-page-bg-number);
    font-family: var(--sf-font);
    color: var(--sf-text-primary);
    position: relative;
    padding: 88px 120px 100px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .glow {
    position: absolute; width: 720px; height: 720px;
    top: -120px; right: -80px;
    background: var(--sf-number-glow);
    pointer-events: none;
  }
  .stat-header {
    position: relative; z-index: 2;
    margin-bottom: 48px;
    max-width: 900px;
  }
  .eyebrow {
    font-size: 13px; font-weight: 600; letter-spacing: 0.2em;
    text-transform: uppercase; color: var(--sf-eyebrow);
    margin-bottom: 16px;
  }
  .eyebrow:empty { display: none; }
  .stat-headline {
    font-size: 40px; font-weight: 600; line-height: 1.15;
    letter-spacing: -0.02em; color: var(--sf-text-secondary);
  }
  .stat-stage {
    position: relative; z-index: 2;
    display: grid;
    grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr);
    gap: 72px;
    align-items: center;
    width: 100%;
    max-width: 1680px;
  }
  .number {
    font-size: clamp(160px, 14vw, 240px);
    font-weight: 700; line-height: 0.92;
    letter-spacing: -0.05em;
    color: var(--sf-accent);
    text-shadow: var(--sf-number-text-shadow);
  }
  .unit {
    font-size: 0.32em; font-weight: 400; color: var(--sf-text-muted);
    margin-left: 8px; vertical-align: super;
  }
  .stat-context {
    font-size: 28px; font-weight: 400; line-height: 1.62;
    color: var(--sf-text-subtitle); max-width: 560px;
    border-left: var(--sf-stat-border-left);
    padding-left: 32px;
  }
  .stat-context:empty { display: none; }
  .hairline {
    position: absolute; bottom: 80px; left: 120px; right: 120px;
    height: 1px;
    background: var(--sf-hairline-gradient);
  }
  .page-num {
    position: absolute; bottom: 56px; right: 120px;
    font-size: 13px; color: var(--sf-page-num);
  }

  body.layout-center .stat-stage {
    grid-template-columns: 1fr;
    text-align: center;
    justify-items: center;
  }
  body.layout-center .stat-context {
    border-left: none; padding-left: 0; max-width: 720px;
  }

  body.vp-comp-stat-hero .number {
    font-size: clamp(200px, 16vw, 280px);
  }
  body.vp-vw-hero .glow {
    width: 900px; height: 900px;
    background: var(--sf-number-glow-hero);
  }
</style>
</head>
<body>
<div class="glow"></div>
<div class="stat-header">
  <p class="eyebrow">{{EYEBROW}}</p>
  <h1 class="stat-headline">{{TITLE}}</h1>
</div>
<div class="stat-stage">
  <div class="number">{{BIG_NUMBER}}<span class="unit">{{NUMBER_UNIT}}</span></div>
  <p class="stat-context">{{BODY}}</p>
</div>
<div class="hairline"></div>
<span class="page-num">{{PAGE_NUM}} / {{TOTAL}}</span>
</body>
</html>
