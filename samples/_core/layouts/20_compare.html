<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, height=1080">
<title>{{TITLE}}</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { width: 1920px; height: 1080px; overflow: hidden; }

  body {
    width: 1920px; height: 1080px;
    background: var(--sf-page-bg-compare);
    font-family: var(--sf-font);
    color: var(--sf-text-primary);
    padding: 80px 120px;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .eyebrow {
    font-size: 13px; font-weight: 600; letter-spacing: 0.2em;
    color: var(--sf-eyebrow); text-transform: uppercase; margin-bottom: 20px;
  }
  .eyebrow:empty { display: none; }
  .title {
    font-size: var(--sf-title-size, 58px); font-weight: 700; line-height: 1.05;
    letter-spacing: -0.03em; margin-bottom: 52px; max-width: 1200px;
  }
  .compare-grid {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 40px;
    align-items: stretch;
    max-width: 1680px;
  }
  .compare-col {
    background: var(--sf-compare-col-bg);
    border: var(--sf-compare-col-border);
    border-top: var(--sf-compare-col-border-top);
    border-radius: var(--sf-panel-radius);
    box-shadow: var(--sf-compare-col-shadow);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    padding: 40px 44px;
    display: flex;
    flex-direction: column;
    min-height: 480px;
  }
  .compare-col-right {
    border-color: var(--sf-compare-col-right-border);
    box-shadow: var(--sf-compare-col-right-shadow);
  }
  .compare-center::before {
    content: '';
    position: absolute;
    top: 8%; bottom: 8%;
    left: 50%; transform: translateX(-50%);
    width: 2px;
    background: var(--sf-compare-center-line);
    box-shadow: var(--sf-compare-center-glow);
    border-radius: 2px;
  }
  .compare-center { position: relative; }
  .compare-col-title {
    font-size: 14px; font-weight: 700; letter-spacing: 0.16em;
    text-transform: uppercase; margin-bottom: 28px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--sf-compare-title-border);
  }
  .compare-col-left .compare-col-title { color: var(--sf-text-secondary); }
  .compare-col-right .compare-col-title { color: var(--sf-accent); }
  .compare-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 20px;
    flex: 1;
  }
  .compare-list li {
    display: flex; align-items: flex-start; gap: 14px;
    font-size: 24px; line-height: 1.52; color: var(--sf-compare-list-text);
  }
  .compare-dot {
    width: 8px; height: 8px; border-radius: 50%;
    margin-top: 12px; flex-shrink: 0;
  }
  .compare-col-left .compare-dot {
    background: var(--sf-text-muted); box-shadow: none;
  }
  .compare-col-right .compare-dot {
    background: var(--sf-accent); box-shadow: var(--sf-compare-dot-right-glow);
  }
  .compare-center { display: flex; align-items: center; justify-content: center; }
  .compare-vs {
    width: 80px; height: 80px; border-radius: 50%;
    border: var(--sf-compare-vs-border);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-weight: 700; color: var(--sf-accent);
    background: var(--sf-compare-vs-bg);
    box-shadow: var(--sf-compare-vs-shadow);
  }
  .hairline {
    position: absolute; bottom: 80px; left: 120px; right: 120px; height: 1px;
    background: var(--sf-hairline-gradient);
  }
  .page-num {
    position: absolute; bottom: 56px; right: 120px;
    font-size: 13px; color: var(--sf-page-num);
  }
  body.layout-wide-left .compare-grid { grid-template-columns: 1.22fr auto 0.88fr; }
  body.layout-wide-right .compare-grid { grid-template-columns: 0.88fr auto 1.22fr; }
  body.vp-vw-hero .title { font-size: var(--sf-title-size, 68px); margin-bottom: 56px; }
</style>
</head>
<body>
  <div class="eyebrow">{{EYEBROW}}</div>
  <h1 class="title">{{TITLE}}</h1>
  <div class="compare-grid">
    <div class="compare-col compare-col-left">
      <div class="compare-col-title">{{COMPARE_LEFT_TITLE}}</div>
      <ul class="compare-list">{{COMPARE_LEFT_POINTS}}</ul>
    </div>
    <div class="compare-center">
      <div class="compare-vs">{{COMPARE_CENTER_LABEL}}</div>
    </div>
    <div class="compare-col compare-col-right">
      <div class="compare-col-title">{{COMPARE_RIGHT_TITLE}}</div>
      <ul class="compare-list">{{COMPARE_RIGHT_POINTS}}</ul>
    </div>
  </div>
  <div class="hairline"></div>
  <span class="page-num">{{PAGE_NUM}} / {{TOTAL}}</span>
</body>
</html>
