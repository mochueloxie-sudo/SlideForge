<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, height=1080">
<title>{{TITLE}}</title>
<style>
  /* wave7 — chart demo DOM polish (--sf-* only) */
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { width: 1920px; height: 1080px; overflow: hidden; }
  body {
    width: 1920px; height: 1080px;
    background: var(--sf-page-bg-panel, var(--sf-body-gradient, var(--sf-body-bg)));
    font-family: var(--sf-font);
    color: var(--sf-text-primary);
    padding: 80px 120px;
    position: relative;
    display: flex; flex-direction: column;
  }
  .title {
    font-size: var(--sf-title-size, 52px); font-weight: 700; line-height: 1.08;
    letter-spacing: -0.03em; margin-bottom: 12px;
  }
  .subtitle { font-size: 18px; color: var(--sf-subtitle-lede, var(--sf-text-secondary)); margin-bottom: 32px; }
  .subtitle:empty { display: none; }
  .chart-area {
    display: flex; align-items: flex-end; gap: 40px;
    flex: 1; min-height: 260px; padding: 28px 32px 40px;
    max-width: 1100px;
    background: var(--sf-panel-bg);
    border: var(--sf-panel-border);
    border-top: var(--sf-panel-border-top);
    border-bottom: var(--sf-panel-border-bottom);
    border-radius: var(--sf-panel-radius, 18px);
    box-shadow: var(--sf-panel-shadow);
  }
  .bar-group { display: flex; flex-direction: column; align-items: center; gap: 12px; flex: 1; }
  .bar-wrap { display: flex; align-items: flex-end; gap: 8px; height: 280px; }
  .bar { width: 52px; border-radius: 6px 6px 0 0; position: relative; }
  .bar-blue {
    background: linear-gradient(180deg, var(--sf-accent-light, var(--sf-accent)) 0%, var(--sf-accent-secondary, var(--sf-accent)) 100%);
  }
  .bar-purple {
    background: linear-gradient(180deg, color-mix(in srgb, var(--sf-accent) 60%, #fff) 0%, var(--sf-accent-secondary, var(--sf-accent)) 100%);
  }
  .bar-val {
    position: absolute; top: -28px; left: 50%; transform: translateX(-50%);
    font-size: 14px; font-weight: 700; color: var(--sf-accent); white-space: nowrap;
  }
  .bar-label { font-size: 14px; color: var(--sf-text-muted); text-align: center; margin-top: 8px; }
  .stats-row { display: flex; gap: 48px; margin-top: 48px; }
  .stat-val { font-size: 48px; font-weight: 700; color: var(--sf-accent); line-height: 1; }
  .stat-label { font-size: 15px; color: var(--sf-text-secondary); margin-top: 6px; }
  .legend { display: flex; gap: 32px; margin-top: 32px; }
  .legend-item {
    display: flex; align-items: center; gap: 10px;
    font-size: 14px; color: var(--sf-text-secondary);
  }
  .legend-item { opacity: 1; }
  .legend-dot { width: 12px; height: 12px; border-radius: 3px; }
  .bar-group .bar-val { color: var(--sf-text-secondary); opacity: 1; }
  .stats-row .stat-item .stat-val { color: var(--sf-accent); opacity: 1; }
  .legend-dot-blue { background: linear-gradient(180deg, var(--sf-accent), var(--sf-accent-secondary, var(--sf-accent))); }
  .legend-dot-purple { background: linear-gradient(180deg, var(--sf-accent-secondary, var(--sf-accent)), var(--sf-text-muted)); }
  .page-num {
    position: absolute; bottom: 56px; right: 120px;
    font-size: 13px; color: var(--sf-page-num, var(--sf-text-muted));
  }
</style>
</head>
<body>
  <div class="title">{{TITLE}}</div>
  <div class="subtitle">{{SUBTITLE}}</div>
  <div class="chart-area">{{CHART_BARS_HTML}}</div>
  <div class="legend">{{CHART_LEGEND_HTML}}</div>
  <div class="stats-row">{{CHART_STATS_HTML}}</div>
  <span class="page-num">{{PAGE_NUM}} / {{TOTAL}}</span>
</body>
</html>
