<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, height=1080">
<title>Funnel</title>
<style>
  /* wave7 — funnel DOM polish (--sf-* only) */
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&family=Manrope:wght@400;500;800&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { width: 1920px; height: 1080px; overflow: hidden; }

  body {
    width: 1920px; height: 1080px;
    background: var(--sf-page-bg-panel, var(--sf-body-gradient, var(--sf-body-bg)));
    font-family: var(--sf-font);
    color: var(--sf-text-primary);
    padding: 80px 120px;
    position: relative;
    display: flex;
    flex-direction: column;
  }
  .eyebrow {
    font-size: 13px; font-weight: 800; letter-spacing: 0.2em;
    color: var(--sf-eyebrow); text-transform: uppercase; margin-bottom: 20px;
    flex-shrink: 0;
  }
  .eyebrow:empty { display: none; }
  .title {
    font-size: var(--sf-title-size, 58px); font-weight: 800; line-height: 1.05;
    color: var(--sf-text-primary); margin-bottom: 36px; max-width: 1100px;
    flex-shrink: 0;
  }
  .fn-wrap {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    max-width: 1320px;
    margin: 0 auto;
    width: 100%;
    counter-reset: fn-stage;
    position: relative;
  }
  .fn-wrap::before {
    content: '';
    position: absolute;
    left: 50%;
    top: 8%;
    bottom: 8%;
    width: 2px;
    transform: translateX(-50%);
    background: linear-gradient(
      180deg,
      color-mix(in srgb, var(--sf-accent) 55%, transparent),
      color-mix(in srgb, var(--sf-accent) 12%, transparent) 70%,
      transparent
    );
    opacity: 0.65;
    pointer-events: none;
    z-index: 0;
  }
  .fn-tier {
    width: var(--fn-w, 100%);
    position: relative;
    z-index: 1;
    counter-increment: fn-stage;
    display: grid;
    grid-template-columns: 52px 1fr;
    grid-template-rows: auto auto;
    gap: 4px 20px;
    align-items: start;
    padding: 22px 32px 24px 24px;
    border-radius: var(--sf-panel-radius, 18px);
    background: var(--sf-panel-bg);
    border: var(--sf-panel-border);
    border-top: var(--sf-panel-border-top);
    box-shadow: var(--sf-panel-shadow-inner, var(--sf-panel-shadow));
    clip-path: polygon(2.5% 0, 97.5% 0, 100% 100%, 0 100%);
    opacity: 1;
  }
  .fn-tier::before {
    content: counter(fn-stage, decimal-leading-zero);
    grid-column: 1;
    grid-row: 1 / -1;
    align-self: center;
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 0.08em;
    color: var(--sf-accent);
    text-align: center;
    align-self: start;
    padding-top: 4px;
  }
  .fn-label {
    grid-column: 2;
    grid-row: 1;
    font-size: 24px;
    font-weight: 700;
    color: var(--sf-text-primary);
    line-height: 1.2;
  }
  .fn-desc {
    grid-column: 2;
    grid-row: 2;
    font-size: 18px;
    line-height: 1.5;
    color: var(--sf-text-secondary);
  }
  .fn-tier::after {
    content: '';
    position: absolute;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.2s ease;
    clip-path: polygon(2.5% 0, 97.5% 0, 100% 100%, 0 100%);
    background: color-mix(in srgb, var(--sf-accent) 12%, transparent);
  }

  body.layout-compact .fn-wrap { gap: 8px; }
  body.layout-compact .fn-wrap::before { top: 6%; bottom: 6%; opacity: 0.5; }
  body.layout-compact .fn-tier { padding: 16px 24px 18px 20px; }
  body.layout-compact .fn-tier:nth-child(1) {
    padding-top: 20px;
    padding-bottom: 22px;
  }
  body.layout-compact .fn-tier:nth-child(1) .fn-label { font-size: 24px; }
  body.layout-compact .fn-tier:not(:first-child) { opacity: 0.86; }
  body.layout-compact .fn-tier:nth-child(3) { opacity: 0.8; }
  body.layout-compact .fn-tier:nth-child(n+4) { opacity: 0.74; }
  body.layout-compact .fn-label { font-size: 20px; }
  body.layout-compact .fn-desc { font-size: 16px; }

  .hairline {
    position: absolute; bottom: 80px; left: 120px; right: 120px;
    height: 1px; background: var(--sf-hairline-gradient, var(--sf-hairline));
  }
  .page-num {
    position: absolute; bottom: 56px; right: 120px;
    font-size: 13px; color: var(--sf-page-num);
  }

  @media (hover: hover) and (pointer: fine) {
    .fn-tier:hover::after { opacity: 1; }
  }
</style>
</head>
<body>
  <div class="eyebrow">{{EYEBROW}}</div>
  <h1 class="title">{{TITLE}}</h1>
  <div class="fn-wrap">{{FUNNEL_TIERS_HTML}}</div>
  <div class="hairline"></div>
  <span class="page-num">{{PAGE_NUM}} / {{TOTAL}}</span>
</body>
</html>
