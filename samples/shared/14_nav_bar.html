<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, height=1080">
<title>{{TITLE}}</title>
<style>
  /* wave7 — nav bar DOM polish (--sf-* only) */
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { width: 1920px; height: 1080px; overflow: hidden; }
  body {
    width: 1920px; height: 1080px;
    background: var(--sf-page-bg-panel, var(--sf-body-gradient, var(--sf-body-bg)));
    font-family: var(--sf-font);
    color: var(--sf-text-primary);
    display: flex; flex-direction: column;
  }
  .topbar {
    background: color-mix(in srgb, var(--sf-panel-bg) 92%, transparent);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--sf-hairline);
    padding: 0 60px;
    height: 72px;
    display: flex; align-items: center; justify-content: space-between;
    flex-shrink: 0;
  }
  .logo { font-size: 18px; font-weight: 700; color: var(--sf-text-primary); }
  .logo span { color: var(--sf-accent); }
  .nav-items { display: flex; gap: 40px; }
  .nav-item { font-size: 15px; color: var(--sf-text-muted); }
  .nav-item.active { color: var(--sf-accent); font-weight: 500; }
  .nav-item.active::after {
    content: ''; display: block; height: 2px; background: var(--sf-accent); margin-top: 4px;
  }
  .progress-bar { height: 3px; background: color-mix(in srgb, var(--sf-text-muted) 20%, transparent); flex-shrink: 0; }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--sf-accent-secondary, var(--sf-accent)), var(--sf-accent));
  }
  .content {
    flex: 1; padding: 80px 120px;
    display: flex; flex-direction: column; justify-content: center;
  }
  .section-label {
    font-size: 13px; color: var(--sf-eyebrow); letter-spacing: 0.15em;
    text-transform: uppercase; margin-bottom: 20px;
  }
  .section-label:empty { display: none; }
  .title {
    font-size: var(--sf-title-size, 58px); font-weight: 700; line-height: 1.08;
    letter-spacing: -0.03em;
    margin-bottom: 24px;
    max-width: 1100px;
  }
  .body {
    font-size: 22px; line-height: 1.65;
    color: var(--sf-subtitle-lede, var(--sf-text-secondary));
    max-width: 820px;
  }
  p.body:empty { display: none; }
  .title:has(+ p.body:empty) { margin-bottom: 16px; }
  ul.nav-lede {
    list-style: none; margin: 0; padding: 0; max-width: 920px;
    display: flex; flex-direction: column; gap: 14px;
  }
  ul.nav-lede li {
    font-size: 21px; line-height: 1.55;
    color: var(--sf-text-secondary);
    padding-left: 22px; position: relative;
  }
  ul.nav-lede li::before {
    content: '';
    position: absolute; left: 0; top: 0.62em;
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--sf-accent);
    box-shadow: 0 0 10px color-mix(in srgb, var(--sf-accent) 45%, transparent);
  }
  .nav-item { transition: color 0.15s ease, opacity 0.15s ease; }
  .nav-items .nav-item:not(.active) {
    opacity: 0.72;
    color: var(--sf-text-muted);
  }
  .nav-items .nav-item.active {
    color: var(--sf-accent);
    font-weight: 600;
    opacity: 1;
  }
  .nav-items .nav-item:first-child.active {
    text-shadow: 0 0 24px color-mix(in srgb, var(--sf-accent) 35%, transparent);
  }
  .bottombar {
    padding: 0 60px 28px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .bottom-text { font-size: 13px; color: var(--sf-text-muted); }
  .page-num { font-size: 13px; color: var(--sf-page-num, var(--sf-text-muted)); }
</style>
</head>
<body>
  <div class="topbar">
    <div class="logo">{{NAV_LOGO_A}}<span>{{NAV_LOGO_B}}</span></div>
    <div class="nav-items">{{NAV_ITEMS_HTML}}</div>
    <div style="font-size:14px;opacity:0.55">{{AUTHOR_DATE}}</div>
  </div>
  <div class="progress-bar"><div class="progress-fill" style="width:{{PROGRESS_PCT}}%"></div></div>
  <div class="content">
    <div class="section-label">{{SECTION_LABEL}}</div>
    <h1 class="title">{{TITLE}}</h1>
    <p class="body">{{SUBTITLE}}</p>
  </div>
  <div class="bottombar">
    <div class="bottom-text">{{BOTTOM_TEXT}}</div>
    <div class="page-num">{{PAGE_NUM}} / {{TOTAL}}</div>
  </div>
</body>
</html>
