<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, height=1080">
<title>{{TITLE}}</title>
<style>
  /* wave7 — panel stat DOM polish (--sf-* only) */
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700;800&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { width: 1920px; height: 1080px; overflow: hidden; }
  body {
    width: 1920px; height: 1080px;
    background: var(--sf-page-bg-panel, var(--sf-body-gradient, var(--sf-body-bg)));
    font-family: var(--sf-font);
    color: var(--sf-text-primary);
    display: flex; align-items: stretch;
    position: relative; overflow: hidden;
  }
  .left {
    flex: 0 0 1100px;
    padding: 80px 80px 80px 120px;
    display: flex; flex-direction: column; justify-content: center;
    border-right: 1px solid var(--sf-hairline);
  }
  .eyebrow {
    font-size: 13px; font-weight: 800; letter-spacing: 0.2em;
    color: var(--sf-eyebrow); text-transform: uppercase; margin-bottom: 18px;
  }
  .eyebrow:empty { display: none; }
  .title {
    font-size: var(--sf-title-size, 52px); font-weight: 800; line-height: 1.05;
    color: var(--sf-text-primary); margin-bottom: 40px;
  }
  .panel {
    background: var(--sf-panel-bg);
    border: var(--sf-panel-border);
    border-top: var(--sf-panel-border-top);
    border-bottom: var(--sf-panel-border-bottom);
    box-shadow: var(--sf-panel-shadow);
    border-radius: var(--sf-panel-radius, 20px);
    padding: 32px 40px;
    flex: 1;
    display: flex; flex-direction: column; justify-content: space-around;
  }
  .kp-item {
    display: flex; align-items: center; gap: 16px;
    font-size: 22px; line-height: 1.5; color: var(--sf-text-secondary);
    padding: 10px 0;
    border-bottom: 1px solid var(--sf-hairline);
  }
  .kp-item:last-child { border-bottom: none; }
  .kp-item { color: var(--sf-text-secondary); opacity: 1; }
  .kp-dot {
    flex-shrink: 0; width: 8px; height: 8px;
    background: var(--sf-accent); border-radius: 50%;
  }
  .right {
    flex: 1;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 80px 60px;
  }
  .stat-label-top {
    font-size: 15px; font-weight: 600; letter-spacing: 0.18em;
    color: var(--sf-eyebrow); text-transform: uppercase; margin-bottom: 24px;
  }
  .stat-value {
    font-size: var(--sf-stat-number-size, 140px); font-weight: 800; line-height: 0.9;
    letter-spacing: -0.05em;
    color: var(--sf-accent-light, var(--sf-accent));
  }
  .stat-unit {
    font-size: 48px; font-weight: 300;
    color: var(--sf-text-muted); margin-left: 8px;
  }
  .stat-name {
    font-size: 24px; font-weight: 500; color: var(--sf-text-secondary);
    margin-top: 24px; text-align: center; line-height: 1.4;
  }
  .stat-caption {
    font-size: 16px; color: var(--sf-text-muted);
    margin-top: 12px; text-align: center; line-height: 1.5; max-width: 500px;
  }
  .stat-ring {
    position: absolute;
    width: 520px; height: 520px;
    border-radius: 50%;
    border: 1px solid var(--sf-hairline);
    opacity: 0.35;
    pointer-events: none;
  }
  .hairline {
    position: absolute; bottom: 80px; left: 120px; right: 120px;
    height: 1px; background: var(--sf-hairline-gradient, var(--sf-hairline));
  }
  .page-num {
    position: absolute; bottom: 56px; right: 120px;
    font-size: 13px; color: var(--sf-page-num);
  }
  body.layout-compact .panel { padding: 24px 32px; }
  body.layout-compact .kp-item { font-size: 20px; padding: 8px 0; }
  body.layout-compact .title { margin-bottom: 32px; font-size: var(--sf-title-size, 48px); }
  body.layout-wide-stat .stat-value { font-size: 168px; }
</style>
</head>
<body>
  <div class="left">
    <div class="eyebrow">{{EYEBROW}}</div>
    <h1 class="title">{{TITLE}}</h1>
    <div class="panel">
      <div class="kp-item"><span class="kp-dot"></span><span>{{KEY_POINT}}</span></div>
    </div>
  </div>
  <div class="right">
    <div class="stat-ring"></div>
    <div class="stat-label-top">{{STAT_EYEBROW}}</div>
    <div class="stat-value">{{STAT_VALUE}}<span class="stat-unit">{{STAT_UNIT}}</span></div>
    <div class="stat-name">{{STAT_LABEL}}</div>
    <div class="stat-caption">{{STAT_CAPTION}}</div>
  </div>
  <div class="hairline"></div>
  <span class="page-num">{{PAGE_NUM}} / {{TOTAL}}</span>
</body>
</html>
