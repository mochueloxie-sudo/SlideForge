<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, height=1080">
<title>Card Grid</title>
<style>
  /* wave7 — card grid DOM polish (--sf-* only) */
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&family=Manrope:wght@400;500;800&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { width: 1920px; height: 1080px; overflow: hidden; }

  body {
    width: 1920px; height: 1080px;
    background: var(--sf-page-bg-panel, var(--sf-body-gradient, var(--sf-body-bg)));
    font-family: var(--sf-font);
    color: var(--sf-text-primary);
    padding: 80px 120px;
    position: relative;
    display: flex;
    flex-direction: column;
  }
  .eyebrow {
    font-size: 13px; font-weight: 800; letter-spacing: 0.2em;
    color: var(--sf-eyebrow); text-transform: uppercase; margin-bottom: 20px;
    flex-shrink: 0;
  }
  .eyebrow:empty { display: none; }
  .title {
    font-size: var(--sf-title-size, 58px); font-weight: 800; line-height: 1.05;
    letter-spacing: -0.03em; color: var(--sf-text-primary);
    margin-bottom: 44px; max-width: 1100px; flex-shrink: 0;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 22px;
    flex: 1;
    min-height: 0;
    align-content: center;
    max-width: 1680px;
  }
  .card {
    background: var(--sf-card-muted-bg, var(--sf-panel-bg));
    border: var(--sf-card-muted-border, var(--sf-panel-border));
    border-radius: var(--sf-panel-radius, 20px);
    box-shadow: var(--sf-panel-shadow);
    padding: 32px 30px 34px;
    display: flex;
    flex-direction: column;
    min-height: 200px;
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: '';
    position: absolute;
    inset: 0 auto 0 0;
    width: 4px;
    background: linear-gradient(180deg, var(--sf-accent), var(--sf-accent-light, var(--sf-accent-secondary)));
    opacity: 0.35;
    border-radius: var(--sf-panel-radius, 20px) 0 0 var(--sf-panel-radius, 20px);
  }
  .grid > .card:first-child {
    background: var(--sf-panel-bg);
    border: var(--sf-panel-border);
    border-top: var(--sf-panel-border-top);
    border-bottom: var(--sf-panel-border-bottom);
    box-shadow: var(--sf-panel-shadow-inner, var(--sf-panel-shadow));
    padding: 40px 36px 42px;
    min-height: 240px;
  }
  .grid > .card:first-child::before {
    width: 6px;
    opacity: 1;
  }
  .grid > .card:first-child .card-title {
    font-size: 28px;
    letter-spacing: -0.02em;
  }
  .grid > .card:first-child .card-body {
    font-size: 19px;
    color: var(--sf-text-secondary);
  }
  .grid > .card:first-child .card-title { color: var(--sf-accent); }
  .grid > .card:not(:first-child) { opacity: 0.9; }
  .grid > .card:not(:first-child)::before { opacity: 0.22; }
  .card-num {
    font-size: 42px; font-weight: 800; line-height: 1;
    color: var(--sf-accent);
    margin-bottom: 14px;
    letter-spacing: -0.04em;
  }
  .card-icon { font-size: 40px; margin-bottom: 16px; line-height: 1; }
  .card-label {
    font-size: 12px; font-weight: 700; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--sf-eyebrow);
    margin-bottom: 10px;
  }
  .card-title {
    font-size: 22px; font-weight: 700; line-height: 1.3;
    color: var(--sf-text-primary); margin-bottom: 10px;
  }
  .card-body {
    font-size: 17px; line-height: 1.6;
    color: var(--sf-text-secondary); flex: 1;
  }
  .card-tag {
    display: inline-block; margin-top: 16px;
    font-size: 11px; font-weight: 700; letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--sf-accent);
    border: 1px solid color-mix(in srgb, var(--sf-accent) 35%, transparent);
    border-radius: 6px;
    padding: 4px 10px;
    align-self: flex-start;
  }
  body.layout-2x2 .grid {
    grid-template-columns: 1fr 1fr;
    max-width: 1520px;
    gap: 24px;
  }
  body.layout-2x2 .grid > .card:first-child {
    grid-column: 1 / -1;
    min-height: 200px;
  }
  body.layout-2x2 .card { padding: 36px 32px; min-height: 180px; }
  body.layout-2x2 .card-title { font-size: 26px; }
  body.layout-2x2 .card-body { font-size: 18px; }

  body.layout-compact .grid { gap: 16px; }
  body.layout-compact .card { padding: 24px 22px 26px; min-height: 160px; }
  body.layout-compact .card-title { font-size: 20px; }
  body.layout-compact .card-body { font-size: 15px; }
  body.layout-compact .grid > .card:first-child {
    min-height: 200px;
    padding: 32px 28px 34px;
  }
  body.layout-compact .grid > .card:first-child .card-title { font-size: 24px; }

  .hairline {
    position: absolute; bottom: 80px; left: 120px; right: 120px;
    height: 1px; background: var(--sf-hairline-gradient, var(--sf-hairline));
  }
  .page-num {
    position: absolute; bottom: 56px; right: 120px;
    font-size: 13px; color: var(--sf-page-num);
  }

  @media (hover: hover) and (pointer: fine) {
    .grid > .card {
      transition: outline-color 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
      outline: 2px solid transparent;
      outline-offset: 3px;
    }
    .grid > .card:hover {
      outline-color: color-mix(in srgb, var(--sf-accent) 40%, transparent);
      box-shadow: var(--sf-panel-shadow-inner, var(--sf-panel-shadow));
    }
  }
</style>
</head>
<body>
  <div class="eyebrow">{{EYEBROW}}</div>
  <h1 class="title">{{TITLE}}</h1>
  <div class="grid">{{CARDS_HTML}}</div>
  <div class="hairline"></div>
  <span class="page-num">{{PAGE_NUM}} / {{TOTAL}}</span>
</body>
</html>
