<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, height=1080">
<title>Architecture Stack</title>
<style>
  /* wave7 — architecture stack DOM polish (--sf-* only) */
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&family=Manrope:wght@400;500;800&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { width: 1920px; height: 1080px; overflow: hidden; }

  body {
    width: 1920px; height: 1080px;
    background: var(--sf-page-bg-panel, var(--sf-body-gradient, var(--sf-body-bg)));
    font-family: var(--sf-font);
    color: var(--sf-text-primary);
    padding: 80px 120px;
    position: relative;
    display: flex;
    flex-direction: column;
  }
  .eyebrow {
    font-size: 13px; font-weight: 800; letter-spacing: 0.2em;
    color: var(--sf-eyebrow); text-transform: uppercase; margin-bottom: 20px;
    flex-shrink: 0;
  }
  .eyebrow:empty { display: none; }
  .title {
    font-size: var(--sf-title-size, 58px); font-weight: 800; line-height: 1.05;
    color: var(--sf-text-primary); margin-bottom: 36px; max-width: 1100px;
    flex-shrink: 0;
  }
  .arch-stack {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    max-width: 1280px;
    margin: 0 auto;
    width: 100%;
    counter-reset: arch-layer;
  }
  .arch-layer {
    counter-increment: arch-layer;
    display: grid;
    grid-template-columns: 56px 6px 1fr;
    gap: 0 24px;
    align-items: stretch;
    width: 100%;
    background: var(--sf-card-muted-bg, var(--sf-panel-bg));
    border: var(--sf-card-muted-border, var(--sf-panel-border));
    border-radius: var(--sf-panel-radius, 18px);
    box-shadow: var(--sf-panel-shadow);
    overflow: hidden;
    min-height: 88px;
    position: relative;
  }
  .arch-layer::before {
    content: counter(arch-layer, decimal-leading-zero);
    grid-column: 1;
    grid-row: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 800;
    letter-spacing: 0.06em;
    color: var(--sf-accent);
    background: color-mix(in srgb, var(--sf-accent) 14%, transparent);
    border-right: 1px solid color-mix(in srgb, var(--sf-accent) 22%, transparent);
  }
  .arch-accent {
    grid-column: 2;
    grid-row: 1;
    background: linear-gradient(
      180deg,
      var(--sf-accent),
      var(--sf-accent-light, var(--sf-accent-secondary))
    );
    opacity: 0.85;
  }
  .arch-inner {
    grid-column: 3;
    grid-row: 1;
    padding: 22px 32px 24px 0;
  }
  .arch-layer:nth-child(1) {
    width: 100%;
    min-height: 112px;
    background: linear-gradient(
      95deg,
      color-mix(in srgb, var(--sf-accent) 22%, var(--sf-panel-bg)) 0%,
      var(--sf-panel-bg) 55%
    );
    border: var(--sf-panel-border);
    border-top: var(--sf-panel-border-top);
    border-bottom: var(--sf-panel-border-bottom);
    box-shadow: var(--sf-panel-shadow-inner, var(--sf-panel-shadow)),
      0 0 0 1px color-mix(in srgb, var(--sf-accent) 22%, transparent);
  }
  .arch-layer:nth-child(1) .arch-accent { opacity: 1; width: 8px; }
  .arch-layer:nth-child(1) .arch-layer-title {
    font-size: 30px;
    color: var(--sf-accent);
  }
  .arch-layer:nth-child(1)::before {
    background: color-mix(in srgb, var(--sf-accent) 20%, transparent);
    color: var(--sf-accent);
  }
  .arch-layer:not(:first-child) { opacity: 0.92; }
  .arch-layer:not(:first-child) .arch-layer-title { color: var(--sf-text-primary); }
  .arch-layer:not(:first-child) .arch-layer-desc { color: var(--sf-text-muted); }
  .arch-layer:not(:first-child) .arch-accent { opacity: 0.65; }
  .arch-layer:nth-child(2) { width: 94%; }
  .arch-layer:nth-child(3) { width: 88%; opacity: 0.9; }
  .arch-layer:nth-child(4) { width: 82%; opacity: 0.86; }
  .arch-layer:nth-child(5) { width: 76%; opacity: 0.82; }
  .arch-layer:nth-child(n+6) { width: 72%; opacity: 0.78; }
  .arch-layer-title {
    font-size: 26px;
    font-weight: 700;
    color: var(--sf-text-primary);
    margin-bottom: 6px;
    letter-spacing: -0.02em;
    line-height: 1.2;
  }
  .arch-layer-desc {
    font-size: 18px;
    line-height: 1.55;
    color: var(--sf-text-secondary);
  }

  body.layout-compact .arch-stack { gap: 8px; }
  body.layout-compact .arch-layer { min-height: 68px; }
  body.layout-compact .arch-layer:nth-child(1) { min-height: 88px; }
  body.layout-compact .arch-inner { padding: 14px 24px 16px 0; }
  body.layout-compact .arch-layer:nth-child(1) .arch-layer-title { font-size: 24px; }
  body.layout-compact .arch-layer:nth-child(2) { width: 96%; }
  body.layout-compact .arch-layer:nth-child(3) { width: 90%; }
  body.layout-compact .arch-layer:nth-child(4) { width: 84%; }
  body.layout-compact .arch-layer:nth-child(5) { width: 78%; }
  body.layout-compact .arch-layer:nth-child(n+6) { width: 74%; }
  body.layout-compact .arch-layer-title { font-size: 21px; margin-bottom: 4px; }
  body.layout-compact .arch-layer-desc { font-size: 16px; }
  body.layout-compact .arch-layer:not(:first-child) { opacity: 0.88; }

  .hairline {
    position: absolute; bottom: 80px; left: 120px; right: 120px;
    height: 1px; background: var(--sf-hairline-gradient, var(--sf-hairline));
  }
  .page-num {
    position: absolute; bottom: 56px; right: 120px;
    font-size: 13px; color: var(--sf-page-num);
  }

  @media (hover: hover) and (pointer: fine) {
    .arch-layer {
      transition: outline-color 0.2s ease, box-shadow 0.2s ease;
      outline: 2px solid transparent;
      outline-offset: 3px;
    }
    .arch-layer:hover {
      outline-color: color-mix(in srgb, var(--sf-accent) 38%, transparent);
      box-shadow: var(--sf-panel-shadow-inner, var(--sf-panel-shadow));
    }
  }
</style>
</head>
<body>
  <div class="eyebrow">{{EYEBROW}}</div>
  <h1 class="title">{{TITLE}}</h1>
  <div class="arch-stack">{{ARCH_LAYERS_HTML}}</div>
  <div class="hairline"></div>
  <span class="page-num">{{PAGE_NUM}} / {{TOTAL}}</span>
</body>
</html>
