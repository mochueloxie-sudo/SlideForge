<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, height=1080">
<title>{{TITLE}}</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { width: 1920px; height: 1080px; overflow: hidden; }
  body {
    width: 1920px; height: 1080px;
    background: var(--sf-page-bg-panel, var(--sf-body-gradient, var(--sf-body-bg)));
    font-family: var(--sf-font);
    color: var(--sf-text-primary);
    padding: 80px 120px;
    position: relative;
    display: flex; flex-direction: column;
  }
  .eyebrow {
    font-size: 13px; font-weight: 600; letter-spacing: 0.15em;
    color: var(--sf-eyebrow); text-transform: uppercase; margin-bottom: 16px; flex-shrink: 0;
  }
  .title {
    font-size: var(--sf-title-size, 52px); font-weight: 700; line-height: 1.08;
    letter-spacing: -0.03em; color: var(--sf-text-primary); margin-bottom: 32px; flex-shrink: 0;
  }
  .code-wrap {
    flex: 1; min-height: 0;
    background: var(--sf-panel-bg);
    border: var(--sf-panel-border);
    border-top: 3px solid var(--sf-accent);
    border-radius: var(--sf-panel-radius, 16px);
    box-shadow: var(--sf-panel-shadow);
    overflow: hidden;
    display: flex; flex-direction: column;
  }
  .code-header {
    display: flex; align-items: center; gap: 8px;
    padding: 14px 20px;
    border-bottom: 1px solid var(--sf-hairline);
    background: rgba(0,0,0,0.12);
  }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .dot-r { background: #ff5f57; }
  .dot-y { background: #febc2e; }
  .dot-g { background: #28c840; }
  .code-lang {
    margin-left: auto; font-size: 12px; color: var(--sf-accent);
    font-family: 'JetBrains Mono', monospace; letter-spacing: 0.08em;
  }
  .code-body {
    flex: 1; padding: 28px 32px; overflow: hidden;
    font-family: 'JetBrains Mono', 'Courier New', monospace;
    font-size: 20px; line-height: 1.65; color: var(--sf-text-secondary);
    white-space: pre;
  }
  .hairline {
    position: absolute; bottom: 80px; left: 120px; right: 120px;
    height: 1px; background: var(--sf-hairline);
  }
  .page-num {
    position: absolute; bottom: 56px; right: 120px;
    font-size: 13px; color: var(--sf-text-muted);
  }
</style>
</head>
<body>
  <div class="eyebrow">{{EYEBROW}}</div>
  <h1 class="title">{{TITLE}}</h1>
  <div class="code-wrap">
    <div class="code-header">
      <div class="dot dot-r"></div>
      <div class="dot dot-y"></div>
      <div class="dot dot-g"></div>
      <span class="code-lang">{{CODE_LABEL}}</span>
    </div>
    <div class="code-body">{{CODE_SNIPPET}}</div>
  </div>
  <div class="hairline"></div>
  <span class="page-num">{{PAGE_NUM}} / {{TOTAL}}</span>
</body>
</html>
