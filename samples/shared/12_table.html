<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, height=1080">
<title>{{TITLE}}</title>
<style>
  /* wave7 — table DOM polish (--sf-* only) */
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { width: 1920px; height: 1080px; overflow: hidden; }
  body {
    width: 1920px; height: 1080px;
    background: var(--sf-page-bg-panel, var(--sf-body-gradient, var(--sf-body-bg)));
    font-family: var(--sf-font);
    color: var(--sf-text-primary);
    padding: 72px 120px 100px;
    position: relative;
    display: flex; flex-direction: column;
  }
  .eyebrow {
    font-size: 13px; font-weight: 600; letter-spacing: 0.15em;
    color: var(--sf-eyebrow); text-transform: uppercase; margin-bottom: 16px; flex-shrink: 0;
  }
  .eyebrow:empty { display: none; }
  .title {
    font-size: var(--sf-title-size, 52px); font-weight: 700; line-height: 1.08;
    margin-bottom: 40px; flex-shrink: 0;
  }
  .table-wrap {
    flex: 1; min-height: 0;
    border-radius: var(--sf-panel-radius, 20px);
    border: var(--sf-panel-border);
    overflow: hidden;
    display: flex; flex-direction: column;
    box-shadow: var(--sf-panel-shadow);
  }
  table { width: 100%; border-collapse: collapse; flex: 1; display: flex; flex-direction: column; }
  thead { flex-shrink: 0; }
  thead tr {
    background: color-mix(in srgb, var(--sf-accent) 26%, var(--sf-panel-bg));
    display: flex;
  }
  thead th {
    flex: 1; padding: 0 32px;
    height: {{TABLE_HEADER_HEIGHT}}px;
    display: flex; align-items: center;
    font-size: {{TABLE_TH_FONT}}px; font-weight: 700;
    color: var(--sf-text-primary);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    border-bottom: 1px solid color-mix(in srgb, var(--sf-accent) 28%, var(--sf-hairline));
  }
  thead th:first-child { color: var(--sf-accent); }
  tbody { flex: 1; display: flex; flex-direction: column; }
  tbody tr { flex: 1; display: flex; }
  tbody tr:nth-child(odd) { background: var(--sf-panel-bg); }
  tbody tr:nth-child(even) {
    background: color-mix(in srgb, var(--sf-accent) 5%, var(--sf-panel-bg));
  }
  tbody tr:first-child td {
    color: var(--sf-text-primary);
    font-weight: 500;
  }
  tbody tr:not(:first-child) { opacity: 0.92; }
  tbody td {
    flex: 1; padding: 0 32px;
    font-size: {{TABLE_FONT_SIZE}}px; color: var(--sf-text-secondary);
    border-bottom: 1px solid var(--sf-hairline);
    display: flex; align-items: center;
  }
  tbody td:first-child {
    font-weight: 600;
    color: var(--sf-text-primary);
  }
  tbody tr:last-child td { border-bottom: none; }
  .hairline {
    position: absolute; bottom: 80px; left: 120px; right: 120px;
    height: 1px; background: var(--sf-hairline);
  }
  .page-num {
    position: absolute; bottom: 56px; right: 120px;
    font-size: 13px; color: var(--sf-text-muted);
  }
</style>
</head>
<body>
  <div class="eyebrow">{{EYEBROW}}</div>
  <h1 class="title">{{TITLE}}</h1>
  <div class="table-wrap">
    <table>
      <thead><tr>{{TABLE_HEADERS}}</tr></thead>
      <tbody>{{TABLE_ROWS}}</tbody>
    </table>
  </div>
  <div class="hairline"></div>
  <span class="page-num">{{PAGE_NUM}} / {{TOTAL}}</span>
</body>
</html>
