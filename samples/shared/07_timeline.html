<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, height=1080">
<title>Timeline</title>
<style>
  /* wave8 — timeline equal rhythm (--sf-* only); no oversized first step */
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&family=Manrope:wght@400;500;800&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { width: 1920px; height: 1080px; overflow: hidden; }

  body {
    width: 1920px; height: 1080px;
    background: var(--sf-page-bg-panel, var(--sf-body-gradient, var(--sf-body-bg)));
    font-family: var(--sf-font);
    color: var(--sf-text-primary);
    padding: 80px 120px;
    position: relative;
    display: flex;
    flex-direction: column;
  }
  .eyebrow {
    font-size: 13px; font-weight: 800; letter-spacing: 0.2em;
    color: var(--sf-eyebrow); text-transform: uppercase; margin-bottom: 20px;
    flex-shrink: 0;
  }
  .eyebrow:empty { display: none; }
  .title {
    font-size: var(--sf-title-size, 58px); font-weight: 800; line-height: 1.05;
    color: var(--sf-text-primary); margin-bottom: 48px; max-width: 900px;
    flex-shrink: 0;
  }
  .timeline {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: 0;
    position: relative;
    padding-left: 56px;
    max-width: 1160px;
    justify-content: center;
  }
  .timeline::before {
    content: '';
    position: absolute;
    left: 19px; top: 12px; bottom: 12px;
    width: 2px;
    background: linear-gradient(
      to bottom,
      var(--sf-accent),
      color-mix(in srgb, var(--sf-accent) 20%, transparent)
    );
    opacity: 0.5;
  }
  .step {
    display: flex;
    align-items: flex-start;
    gap: 28px;
    padding: 22px 24px 22px 8px;
    position: relative;
    border-radius: var(--sf-panel-radius, 14px);
    background: var(--sf-panel-bg);
    border: var(--sf-panel-border);
    box-shadow: var(--sf-panel-shadow);
    opacity: 1;
  }
  .step-dot {
    position: absolute;
    left: -44px; top: 28px;
    width: 16px; height: 16px;
    border-radius: 50%;
    background: var(--sf-accent);
    box-shadow: 0 0 12px color-mix(in srgb, var(--sf-accent) 45%, transparent);
    flex-shrink: 0;
  }
  .step-num {
    font-size: 13px; font-weight: 800; letter-spacing: 0.12em;
    color: var(--sf-accent); text-transform: uppercase;
    min-width: 48px; padding-top: 4px;
    flex-shrink: 0;
  }
  .step-content { flex: 1; }
  .step-label {
    font-size: 24px; font-weight: 700;
    color: var(--sf-text-primary); line-height: 1.3;
    margin-bottom: 6px;
  }
  .step-desc {
    font-size: 18px; font-weight: 400;
    color: var(--sf-text-secondary); line-height: 1.55;
  }
  .timeline .step + .step { margin-top: 10px; }

  .hairline {
    position: absolute; bottom: 80px; left: 120px; right: 120px;
    height: 1px; background: var(--sf-hairline-gradient, var(--sf-hairline));
  }
  .page-num {
    position: absolute; bottom: 56px; right: 120px;
    font-size: 13px; color: var(--sf-page-num);
  }

  @media (hover: hover) and (pointer: fine) {
    .timeline .step {
      transition: outline-color 0.2s ease, background-color 0.2s ease;
      outline: 2px solid transparent;
      outline-offset: 2px;
    }
    .timeline .step:hover {
      outline-color: color-mix(in srgb, var(--sf-accent) 35%, transparent);
      background-color: color-mix(in srgb, var(--sf-accent) 8%, transparent);
    }
  }

  body.layout-horizontal .title { margin-bottom: 56px; }
  body.layout-horizontal .timeline {
    flex-direction: row; padding-left: 0; gap: 16px;
    align-items: stretch; max-width: 100%;
  }
  body.layout-horizontal .timeline::before { display: none; }
  body.layout-horizontal .step {
    flex: 1 1 0; min-width: 0;
    flex-direction: column; align-items: center;
    text-align: center;
    padding: 24px 18px; gap: 12px;
    margin-top: 0;
    background: var(--sf-panel-bg);
    border: var(--sf-panel-border);
    border-radius: var(--sf-panel-radius, 18px);
    box-shadow: var(--sf-panel-shadow);
  }
  body.layout-horizontal .timeline .step + .step { margin-top: 0; }
  body.layout-horizontal .step-dot { position: static; margin-bottom: 8px; }
  body.layout-horizontal .step-label { font-size: 20px; }
  body.layout-horizontal .step-desc { font-size: 15px; }

  body.layout-alternating .timeline { padding-left: 0; max-width: 100%; }
  body.layout-alternating .timeline::before { left: 50%; transform: translateX(-50%); }
  body.layout-alternating .step { width: 44%; padding-right: 60px; margin-right: 6%; }
  body.layout-alternating .step:nth-child(even) {
    margin-right: 0; margin-left: 50%; padding-right: 0; padding-left: 60px;
  }
  body.layout-alternating .step-dot { left: unset; right: -54px; }
  body.layout-alternating .step:nth-child(even) .step-dot { right: unset; left: -54px; }

  body.layout-compact .step { padding: 16px 18px 16px 6px; }
  body.layout-compact .step-label { font-size: 20px; }
  body.layout-compact .step-desc { font-size: 16px; }
  body.layout-compact .timeline { padding-left: 48px; }
  body.layout-compact .step-dot { width: 14px; height: 14px; top: 24px; }
  body.layout-compact.layout-horizontal .step { padding: 18px 14px; }
  body.layout-compact.layout-horizontal .step-label { font-size: 18px; }
</style>
</head>
<body>
  <div class="eyebrow">{{EYEBROW}}</div>
  <h1 class="title">{{TITLE}}</h1>
  <div class="timeline">{{STEPS_HTML}}</div>
  <div class="hairline"></div>
  <span class="page-num">{{PAGE_NUM}} / {{TOTAL}}</span>
</body>
</html>
