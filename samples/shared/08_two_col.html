<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, height=1080">
<title>Two Column</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&family=Manrope:wght@400;500;800&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { width: 1920px; height: 1080px; overflow: hidden; }

  body {
    width: 1920px; height: 1080px;
    background: var(--sf-page-bg-panel, var(--sf-body-gradient, var(--sf-body-bg)));
    font-family: var(--sf-font);
    color: var(--sf-text-primary);
    padding: 80px 120px;
    position: relative;
    display: flex;
    flex-direction: column;
  }
  .eyebrow {
    font-size: 13px; font-weight: 800; letter-spacing: 0.2em;
    color: var(--sf-eyebrow); text-transform: uppercase; margin-bottom: 20px;
    flex-shrink: 0;
  }
  .title {
    font-size: var(--sf-title-size, 58px); font-weight: 800; line-height: 1.05;
    letter-spacing: -0.03em; color: var(--sf-text-primary);
    margin-bottom: 44px; max-width: 1100px; flex-shrink: 0;
  }
  .cols {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 64px;
    flex: 1;
    min-height: 0;
    align-items: start;
  }
  .col-left .body-text {
    font-size: 24px; font-weight: 400;
    color: var(--sf-text-secondary);
    line-height: 1.7;
  }
  .col-right {
    background: var(--sf-panel-bg);
    border: var(--sf-panel-border);
    border-top: var(--sf-panel-border-top);
    border-bottom: var(--sf-panel-border-bottom);
    box-shadow: var(--sf-panel-shadow);
    border-radius: var(--sf-panel-radius, 20px);
    padding: 40px 48px;
  }
  .col-right-label {
    font-size: 13px; font-weight: 800; letter-spacing: 0.15em;
    color: var(--sf-accent); text-transform: uppercase; margin-bottom: 24px;
  }
  .kp-list { list-style: none; display: flex; flex-direction: column; gap: 18px; }
  .kp-item {
    display: flex; align-items: flex-start; gap: 14px;
    font-size: 21px; color: var(--sf-text-primary); line-height: 1.45;
  }
  .kp-arrow { color: var(--sf-accent); flex-shrink: 0; font-size: 18px; padding-top: 2px; }
  .hairline {
    position: absolute; bottom: 80px; left: 120px; right: 120px;
    height: 1px; background: var(--sf-hairline);
    flex-shrink: 0;
  }
  .page-num {
    position: absolute; bottom: 56px; right: 120px;
    font-size: 13px; color: var(--sf-text-muted);
  }
  body.layout-wide-left .cols { grid-template-columns: 1.55fr 1fr; }
  body.layout-wide-right .cols { grid-template-columns: 1fr 1.55fr; }
</style>
</head>
<body>
  <div class="eyebrow">{{EYEBROW}}</div>
  <h1 class="title">{{TITLE}}</h1>
  <div class="cols">
    <div class="col-left">{{LEFT_BODY}}</div>
    <div class="col-right">
      <div class="col-right-label">{{RIGHT_LABEL}}</div>
      <ul class="kp-list">{{RIGHT_POINTS}}</ul>
    </div>
  </div>
  <div class="hairline"></div>
  <span class="page-num">{{PAGE_NUM}} / {{TOTAL}}</span>
</body>
</html>
