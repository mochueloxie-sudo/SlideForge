<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, height=1080">
<title>{{TITLE}}</title>
<style>
  /* wave7 — quote context DOM polish (--sf-* only) */
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&family=Manrope:wght@400;500;700;800&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { width: 1920px; height: 1080px; overflow: hidden; }
  body {
    width: 1920px; height: 1080px;
    background: var(--sf-page-bg-panel, var(--sf-body-gradient, var(--sf-body-bg)));
    font-family: var(--sf-font);
    color: var(--sf-text-primary);
    padding: 80px 160px 100px;
    display: flex; flex-direction: column; justify-content: center;
    position: relative; overflow: hidden;
  }
  .eyebrow {
    font-size: 13px; font-weight: 800; letter-spacing: 0.2em;
    color: var(--sf-eyebrow); text-transform: uppercase; margin-bottom: 24px;
    flex-shrink: 0;
  }
  .eyebrow:empty { display: none; }
  /* ── Quote block ────────────────────────────────────────── */
  .quote-wrap {
    flex: 1; display: flex; align-items: center;
    border-left: 4px solid var(--sf-accent);
    padding-left: 56px;
    margin-bottom: 40px;
  }
  .quote-mark {
    font-size: 160px; line-height: 1; font-weight: 800;
    color: var(--sf-accent); opacity: 0.15;
    position: absolute; left: 120px; top: 100px;
    font-family: Georgia, serif;
    pointer-events: none;
  }
  .quote-text {
    font-size: 48px; font-weight: 600; line-height: 1.35;
    color: var(--sf-text-primary);
    max-width: 1300px;
  }
  /* ── Attribution + context ──────────────────────────────── */
  .context-wrap {
    background: color-mix(in srgb, var(--sf-panel-bg) 88%, transparent);
    border: var(--sf-panel-border);
    border-top: 1px solid color-mix(in srgb, var(--sf-accent) 18%, transparent);
    box-shadow: var(--sf-panel-shadow);
    border-radius: var(--sf-panel-radius, 20px);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    padding: 28px 40px;
    display: flex; align-items: flex-start; gap: 40px;
    flex-shrink: 0;
    opacity: 0.92;
  }
  .attr-block { flex-shrink: 0; }
  .attr-name {
    font-size: 20px; font-weight: 700; color: var(--sf-accent-light, var(--sf-accent));
    margin-bottom: 4px;
  }
  .attr-title {
    font-size: 15px; color: var(--sf-text-muted);
  }
  .attr-title:empty { display: none; }
  .context-divider {
    width: 1px; background: var(--sf-hairline);
    align-self: stretch; flex-shrink: 0;
  }
  .context-text {
    font-size: 20px; line-height: 1.6;
    color: var(--sf-text-secondary);
  }
  /* ── Footer ─────────────────────────────────────────────── */
  .hairline {
    position: absolute; bottom: 80px; left: 120px; right: 120px;
    height: 1px; background: var(--sf-hairline);
  }
  .page-num {
    position: absolute; bottom: 56px; right: 120px;
    font-size: 13px; color: var(--sf-text-muted);
  }

  /* ── layout hints ─────────────────────────────────────────── */
  body.layout-full .quote-text { font-size: 64px; }
  body.layout-full .quote-wrap { border-left: none; padding-left: 0; }
  body.layout-centered { align-items: center; text-align: center; }
  body.layout-centered .quote-wrap { border-left: none; padding-left: 0; justify-content: center; }
  body.layout-centered .quote-text { text-align: center; }
  body.layout-centered .context-wrap { justify-content: center; }
</style>
</head>
<body>
  <div class="quote-mark">"</div>
  <div class="eyebrow">{{EYEBROW}}</div>
  <div class="quote-wrap">
    <div class="quote-text">{{QUOTE_BODY}}</div>
  </div>
  <div class="context-wrap">
    <div class="attr-block">
      <div class="attr-name">{{QUOTE_SOURCE}}</div>
      <div class="attr-title">{{QUOTE_ROLE}}</div>
    </div>
    <div class="context-divider"></div>
    <div class="context-text">{{CONTEXT_BODY}}</div>
  </div>
  <div class="hairline"></div>
  <span class="page-num">{{PAGE_NUM}} / {{TOTAL}}</span>
</body>
</html>
