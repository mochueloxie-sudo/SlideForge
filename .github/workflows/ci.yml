name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs on the same branch when a new push lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: validate + render smoke (no browser)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # Skip downloading Puppeteer's bundled Chromium: this CI only exercises
    # validate / design / html which don't need a browser. Saves ~50 MB and
    # avoids needing GTK / X11 libs on the runner. The screenshot / package
    # path is exercised manually before tagging a release.
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate v4-schema example scenes
        run: |
          set -e
          fail=0
          # Whitelist: only files that are intentionally authored to v4 strict
          # schema. tencent_intro_scenes_fixture.json + verify_notebook_shell_*.json
          # are legacy v3 fixtures kept around for npm-script demos; they rely
          # on step2's content_variant inference and don't pass validate.
          # Tracked for upgrade — see CHANGELOG TODO.
          for f in examples/scenes_example.json examples/four_new_variants_scenes.json; do
            echo "── validate $f ──"
            result=$(printf '{"command":"validate","scenes":"%s"}' "$f" | node executor.js)
            echo "$result"
            if ! echo "$result" | grep -q '"valid": true'; then
              echo "::error file=$f::validation failed"
              fail=1
            fi
          done
          exit $fail

      - name: Smoke render — design + html (browser-free path)
        run: |
          set -e
          rm -rf ci_smoke && mkdir -p ci_smoke
          cp examples/scenes_example.json ci_smoke/scenes.json

          echo "── design ──"
          printf '{"command":"design","scenes":"./ci_smoke/scenes.json","output_dir":"./ci_smoke","design_mode":"deep-tech-keynote"}' | node executor.js

          echo "── html ──"
          printf '{"command":"html","scenes":"./ci_smoke/scenes.json","design_params":"./ci_smoke/design_params.json","output_dir":"./ci_smoke"}' | node executor.js

          echo "── verify artifacts ──"
          test -s ci_smoke/design_params.json || { echo "::error::missing design_params.json"; exit 1; }
          test -s ci_smoke/page_001.html      || { echo "::error::missing page_001.html"; exit 1; }
          test -s ci_smoke/page_004.html      || { echo "::error::missing page_004.html (expected 4 pages)"; exit 1; }
          echo "✅ all artifacts present"

      - name: Reject legacy stepN commands
        run: |
          set -e
          # step0/step1 should throw with rename hint
          for cmd in step0 step1 step2 step3 step4 step5 step6 step7; do
            if printf '{"command":"%s","scenes":"x"}' "$cmd" | node executor.js 2>/dev/null; then
              echo "::error::legacy command $cmd should have thrown but exited 0"
              exit 1
            fi
          done
          echo "✅ all 8 legacy stepN commands correctly rejected"
